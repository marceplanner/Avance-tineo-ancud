<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Avance Tineo–Ancud</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 26'%3E%3Cpath d='M11 1 L15.5 8 L21 8 L21 10.5 L15.5 10.5 L17.5 25 L4.5 25 L6.5 10.5 L1 10.5 L1 8 L6.5 8 Z' fill='%231c5cab'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f5f7f8; --surface-3:#e3e8eb;
  --ink:#14212b; --ink-2:#44525d; --muted:#76838d; --line:#d9dfe3; --line-2:#bfc9d0;
  --accent:#1f5fbf; --accent-soft:#e3ecf9; --on-accent:#ffffff;
  --c-continente:#2a78d6; --c-cruce:#eb6834; --c-isla:#1baf7a;
  --i-per:#eda100; --i-acc:#e87ba4; --i-fun:#008300; --i-mon:#4a3aa7;
  --seq-hi:#1c5cab; --on-seq:#ffffff; --vano-hi:#c9501d; --water:#d7e6f5;
  --good:#0ca30c; --good-ink:#006300; --eje:#3987e5; --warn:#fab219; --warn-ink:#8a5a00; --crit-ink:#b02a2a;
  --c-se:#4a3aa7; --fill-ok:#bfe6bf; --concrete:#c3cacf; --steel:#1d2a33;
  --lib-ok:#1e8e43; --lib-tram:#b77900; --lib-res:#c4382b; --lib-pend:#7b8892; --lib-na:#4f7186;
  --shadow:0 1px 2px rgba(20,33,43,.06),0 4px 16px rgba(20,33,43,.05);
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0e1316; --surface:#161e24; --surface-2:#1c262d; --surface-3:#26323b;
    --ink:#ecf1f4; --ink-2:#b4c0c8; --muted:#86939c; --line:#26323b; --line-2:#394752;
    --accent:#5b9cf0; --accent-soft:#1b2e47; --on-accent:#0e1316;
    --c-continente:#3987e5; --c-cruce:#d95926; --c-isla:#199e70;
    --i-per:#c98500; --i-acc:#d55181; --i-fun:#0ca30c; --i-mon:#9085e9;
    --seq-hi:#86b6ef; --on-seq:#0e1316; --vano-hi:#f08a5d; --water:#16283a;
    --good:#0ca30c; --good-ink:#2fc22f; --eje:#5b9cf0; --warn-ink:#fab219; --crit-ink:#f07474;
    --c-se:#9085e9; --fill-ok:#1f4d24; --concrete:#56626b; --steel:#dfe7ec;
    --lib-ok:#3cc169; --lib-tram:#f2b53c; --lib-res:#f17b6f; --lib-pend:#8d9aa3; --lib-na:#8fb0c4;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:0 48px}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-disp);text-wrap:balance;margin:0;letter-spacing:.005em}
h2{font-size:1.25rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-disp);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.84rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.rotulo{display:grid;grid-template-columns:1fr auto;border:1.5px solid var(--ink);background:var(--surface);margin-top:16px}
.rotulo .main{padding:14px 18px;border-right:1.5px solid var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.rotulo .code{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2);letter-spacing:.04em}
.rotulo h1{font-size:clamp(1.35rem,3.2vw,2rem);font-weight:700;line-height:1.1}
.rotulo .sub{color:var(--ink-2);font-size:.9rem}
.rotulo .cells{display:grid;grid-template-columns:repeat(3,minmax(100px,auto))}
.rotulo .cell{padding:10px 14px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;justify-content:center;gap:2px}
.rotulo .cell:first-child{border-left:0}
.rotulo .cell b{font-family:var(--f-mono);font-weight:600;font-size:1.05rem}
.rotulo.solo{grid-template-columns:1fr}.rotulo.solo .main{border-right:0}
@media (max-width:760px){.rotulo{grid-template-columns:1fr}.rotulo .main{border-right:0;border-bottom:1.5px solid var(--ink)}.rotulo.solo .main{border-bottom:0}.rotulo .cells{grid-template-columns:repeat(3,1fr)}.rotulo .cell{padding:8px 10px}}

nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;padding-block:10px;overflow-x:auto;scrollbar-width:none;align-items:center}
nav.tabs button{border:1px solid var(--line-2);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.userbox{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:.8rem;white-space:nowrap;color:var(--ink-2);padding-left:10px}
.userbox button{border:1px solid var(--line-2);background:var(--surface);padding:6px 10px;border-radius:999px;font-size:.8rem}
.role{font-family:var(--f-disp);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;border:1px solid currentColor;border-radius:999px;padding:1px 8px}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px dashed var(--warn);background:color-mix(in oklab,var(--warn) 10%,var(--surface));padding:10px 14px;margin-bottom:14px;font-size:.9rem}
.banner b{font-family:var(--f-disp)}
.note{border:1px solid var(--line);background:var(--surface-2);padding:10px 14px;font-size:.9rem;color:var(--ink-2)}
.progress{height:8px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:var(--w)}

.panel{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

.auth{max-width:420px;margin:28px auto 0;display:flex;flex-direction:column;gap:14px}
.auth .panel{display:flex;flex-direction:column;gap:14px}
.auth .err{color:var(--crit-ink);font-size:.88rem}
.linklike{all:unset;cursor:pointer;color:var(--accent);font-size:.88rem;text-decoration:underline;text-underline-offset:3px}

.ringbox{position:relative;display:inline-grid;place-items:center;flex:none}
.ringbox svg{display:block}
.ringbox .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ringbox .rv b{font-family:var(--f-disp);font-weight:700}
.ringbox .rv span{font-size:.68rem;color:var(--muted);font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.06em}

.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.hero .htxt{display:flex;flex-direction:column;gap:8px}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini{border:1.5px solid var(--line);background:var(--surface);padding:10px;display:flex;gap:12px;align-items:center;text-align:left;border-radius:6px}
.mini:hover{border-color:var(--ink-2)}
.mini[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.mini .mt{display:flex;flex-direction:column;gap:2px;min-width:0}
.mini .mt b{font-family:var(--f-disp);font-size:1.05rem}
.mini .mt span{font-size:.78rem;color:var(--ink-2)}
@media (max-width:860px){.hero{grid-template-columns:1fr;justify-items:center}.hero .htxt{width:100%}.minis{grid-template-columns:1fr}}

.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;flex-wrap:wrap;max-width:100%}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:.85rem;border-left:1px solid var(--line-2);display:inline-flex;align-items:center;gap:6px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dot{width:10px;height:10px;border-radius:2px;background:var(--c);flex:none;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:500;color:var(--ink-2)}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--ink-2);flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}

.hbars{display:flex;flex-direction:column;gap:12px}
.hb{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px;align-items:center}
.hb .hl{font-size:.88rem;display:flex;flex-direction:column;line-height:1.2}
.hb .hl small{color:var(--muted);font-size:.74rem}
.hb .tracks{display:flex;flex-direction:column;gap:3px}
.trk{display:grid;grid-template-columns:1fr 50px;gap:8px;align-items:center}
.trk .tb{height:12px;background:var(--surface-3);border-radius:2px;position:relative;overflow:hidden}
.trk .tb i{position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--c,var(--accent));border-radius:2px}
.trk .tv{font-family:var(--f-mono);font-size:.78rem;text-align:right}
.trk.big .tb{height:18px}
button.hb{all:unset;display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px;align-items:center;cursor:pointer;padding:4px;border-radius:4px}
button.hb:hover{background:var(--surface-2)}
button.hb:focus-visible{outline:2px solid var(--accent)}
.drill{margin:-4px 0 4px 16px;padding:8px 12px;border-left:2px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
.drill .trk{grid-template-columns:minmax(140px,240px) 1fr 50px}
.drill .trk span{font-size:.8rem;color:var(--ink-2)}

.stk{display:flex;height:22px;border-radius:3px;overflow:hidden;background:var(--surface-3)}
.stk i{display:grid;place-items:center;font-style:normal;font-size:.72rem;font-family:var(--f-mono);font-weight:600;min-width:0;overflow:hidden;white-space:nowrap}
.stk .ter{background:var(--good);color:#fff}
.stk .eje{background:var(--eje);color:var(--on-accent)}
.stk .sin{background:var(--surface-3);color:var(--ink-2)}
.stkrow{display:grid;grid-template-columns:110px 1fr 48px;gap:10px;align-items:center;font-size:.86rem}
/* ===== Modelos en elevación / planta (lenguaje de plano) ===== */
.panel{box-shadow:none}
.mini,.kpic{border-radius:2px}
.mdl{display:block;width:100%;height:auto}
.mdl .ghost{fill:none;stroke:var(--line-2);stroke-width:.8;stroke-dasharray:2.5 2}
.mdl .steel{fill:none;stroke:var(--steel);stroke-width:1.1;stroke-linejoin:round}
.mdl .gl{stroke:var(--ink-2);stroke-width:1.2}
.mdl .earth{fill:url(#pat-earth)}
.mdl .water{fill:url(#pat-water)}
.mdl .conc{fill:url(#pat-conc);stroke:var(--ink-2);stroke-width:.8}
.mdl .pad{fill:var(--surface);stroke:var(--ink-2);stroke-width:.8}
.mdl .padg{fill:none;stroke:var(--line-2);stroke-width:.8;stroke-dasharray:2 2}
.mdl .concp{fill:var(--concrete);opacity:.55}
.mdl .wire{fill:none;stroke:var(--steel);stroke-width:1.2}
.mdl .wire.none{stroke:var(--line-2);stroke-width:.9;stroke-dasharray:1.5 3}
.mdl .wire.og{stroke-width:.8}
.mdl .back{opacity:.5}
.mdl .steelf{fill:var(--steel);stroke:var(--steel);stroke-width:.6}
.mdl .steel.half{opacity:.45}
.mdl .padw{fill:var(--surface);stroke:var(--line-2);stroke-width:.8;stroke-dasharray:2 2}
.mdl .dim{opacity:.22}
.mdl .wire.patw{stroke-width:.9}
.mdl .wire.road{stroke:var(--ink-2);stroke-width:2.6}
.mdl .wire.none.road{stroke:var(--line-2);stroke-width:1.4;stroke-dasharray:3 2}
.sheets{display:flex;flex-direction:column}
.tmfig{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border:1px solid var(--line)}
.tmfig>div{padding:10px 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.tmfig>div:first-child{border-left:0}
.tmfig b{font-family:var(--f-disp);font-size:1.55rem;font-weight:700;line-height:1.1}
.tmfig span{font-size:.78rem;color:var(--ink-2)}
.tmfig>div>span:first-child{font-family:var(--f-disp);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.74rem}
.mdl.sheet{border-bottom:1px solid var(--line)}
.mdl.sheet:last-child{border-bottom:0}
.mdl .tx{font-family:var(--f-mono);font-size:11px;fill:var(--ink-2)}
.mdl .tx.b{font-weight:600;fill:var(--ink)}
.mdl .cap{font-family:var(--f-disp);font-size:11px;font-weight:600;letter-spacing:.08em;fill:var(--muted);text-transform:uppercase}
.mdl .big{font-family:var(--f-disp);font-weight:700;fill:var(--ink)}
.mdl .brk{fill:none;stroke-width:2}
.mdl .hit{fill:transparent;cursor:pointer}
.mdl .hit:hover,.mdl .hit:focus-visible{fill:var(--accent-soft);fill-opacity:.55;outline:none}
.mdl g.lnk{cursor:pointer;outline:none}
.mdl g.lnk:hover .v,.mdl g.lnk:focus-visible .v,.mdl g.lnk.on .v{fill:var(--accent)}
.mdl g.lnk.on .n{fill:var(--accent)}
.mdl .ldr{stroke:var(--ink-2);stroke-width:.7;fill:none}
.mdl-wrap{overflow-x:auto}
.mlegend{display:flex;gap:18px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);align-items:center}
.mlegend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mlegend svg{flex:none}
.mlegend .muted{margin-left:auto}
.hero2{display:flex;flex-direction:column;gap:14px}
.htop{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hfig .big{font-family:var(--f-disp);font-weight:700;font-size:clamp(3rem,7vw,4.4rem);line-height:.9;letter-spacing:-.02em}
.hfig .big small{font-size:.42em;font-weight:600;color:var(--ink-2);margin-left:4px;letter-spacing:0}
.hfig .sub{font-size:.86rem;color:var(--ink-2);margin-top:6px}
.sectab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line)}
.sectab button{all:unset;cursor:pointer;padding:10px 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.sectab button:first-child{border-left:0}
.sectab button:hover{background:var(--surface-2)}
.sectab button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sectab button[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 0 3px 0 var(--c)}
.sectab .n{font-family:var(--f-disp);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.sectab .v{font-family:var(--f-disp);font-size:1.7rem;font-weight:700;line-height:1}
.sectab .d{font-size:.76rem;color:var(--ink-2)}
@media (max-width:760px){.sectab{grid-template-columns:1fr 1fr}.sectab button:nth-child(3){border-left:0}.sectab button:nth-child(n+3){border-top:1px solid var(--line)}}
.kpic .kbody{display:flex;gap:12px;align-items:center}
.kpic .kicon{flex:none;width:92px;height:62px}
.kpic .ktally{display:flex;justify-content:space-between;gap:6px;font-size:.76rem;color:var(--ink-2);border-top:1px solid var(--line);padding-top:6px}
.kpic .ktally b{font-family:var(--f-mono);color:var(--ink)}
table.tec td,table.tec th{padding:6px 10px}
table.tec td.r b{font-family:var(--f-mono)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;border:1px solid var(--line)}
.plans .pl{padding:10px 12px;border-left:1px solid var(--line);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;margin:-1px 0 0 -1px}
.plans .pl h4{font-size:.95rem;display:flex;justify-content:space-between;gap:6px}
.plans .pl h4 b{font-family:var(--f-mono)}
.plans .pl ul{margin:0;padding:0;list-style:none;font-size:.74rem;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.plans .grp{grid-column:1/-1;padding:6px 12px;border-top:1px solid var(--line);margin-top:-1px}
.steps-legend.plain i{background:none;border:1px solid var(--line-2);color:var(--ink-2)}
.smx-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table.smx{border-collapse:separate;border-spacing:2px;width:auto;font-size:.75rem}
.smx th,.smx td{padding:0;border:0;white-space:nowrap;background:none}
.smx .rh{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:2px 12px 2px 8px;font-family:var(--f-disp);font-weight:600;font-size:.82rem;color:var(--ink);min-width:178px;text-transform:none;letter-spacing:0;border-right:1px solid var(--line)}
.smx .rh small{display:block;font-family:var(--f-mono);font-weight:500;font-size:.68rem;color:var(--muted)}
.smx .gh{font-family:var(--f-disp);font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:2px 3px;border-bottom:1.5px solid var(--line-2);position:static}
.smx .gh.gs{color:var(--ink);font-size:.74rem;border-bottom:3px solid var(--c)}
.smx tr.ids th{vertical-align:bottom;position:static}
.smx .mxid{all:unset;cursor:pointer;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-mono);font-size:.64rem;font-weight:600;color:var(--ink-2);padding:2px 0;display:inline-block;line-height:16px;width:16px;text-align:left}
.smx .mxid:hover,.smx .mxid:focus-visible{color:var(--accent);outline:1px solid var(--accent)}
.smx td.c{width:16px;min-width:16px;height:24px;border-radius:2px;background:var(--surface-3);cursor:pointer}
.smx td.c.p{background:color-mix(in oklab,var(--eje) var(--p),var(--surface-3))}
.smx td.c.ok{background:var(--good)}
.smx td.c.na{background:transparent;cursor:default;outline:1px dashed var(--line);outline-offset:-3px}
.smx td.c:not(.na):hover{outline:2px solid var(--ink);outline-offset:-1px}
.smx .tot{position:sticky;right:0;z-index:2;background:var(--surface);padding:2px 8px;border-left:1px solid var(--line);font-size:.78rem;text-align:left;min-width:92px}
.smx td.tot .tb{display:block;height:6px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-bottom:2px}
.smx td.tot .tb i{display:block;height:100%;width:var(--w);background:var(--good)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kpic{border:1.5px solid var(--line);background:var(--surface);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.kpic:hover{border-color:var(--ink-2)}
.kpic .kh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kpic .kv{display:flex;align-items:baseline;gap:4px;line-height:1}
.kpic .kv b{font-family:var(--f-disp);font-size:2.2rem;font-weight:700}
.kpic .kv .of{font-family:var(--f-disp);font-size:1.1rem;color:var(--muted)}
.kpic .kp{font-family:var(--f-mono);font-weight:600;font-size:.9rem}
.kpic .kp.ok{color:var(--good-ink)}
.kpic .kl{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:4px 8px;font-size:.78rem;color:var(--ink-2)}
.kpic .kl span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.kpic .kl b{font-family:var(--f-mono)}
.kpic .ks{font-size:.76rem;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block;background:var(--c)}
.sw.o{background:transparent;border:1.5px solid var(--line-2)}

.cols{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:18px;border-bottom:1px solid var(--line-2)}
.col{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;border:0;background:none;padding:0}
.col .cb{width:70%;max-width:34px;background:var(--seq-hi);border-radius:3px 3px 0 0;height:var(--h);min-height:2px}
.col:hover .cb,.col[aria-pressed="true"] .cb{background:var(--accent);outline:2px solid var(--accent)}
.col .cv{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-2)}
.colx{display:flex;gap:6px}
.colx span{flex:1 0 34px;text-align:center;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}

.feed{display:flex;flex-direction:column}
.feed .it{display:grid;grid-template-columns:86px 1fr auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.feed .it:last-child{border-bottom:0}
.feed .d{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2)}
.feed .w{font-size:.88rem;min-width:0}
.feed .w .o{color:var(--ink-2);font-size:.82rem;margin-top:2px}
.feed .p{font-family:var(--f-mono);font-weight:600}
.linkbtn{all:unset;cursor:pointer;font-family:var(--f-mono);font-weight:600;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.linkbtn:hover{text-decoration-color:var(--ink)}
.linkbtn:focus-visible{outline:2px solid var(--accent)}


.tbl-wrap{overflow:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--f-disp);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);background:var(--surface-2);position:sticky;top:0;z-index:1}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.heat{text-align:center;font-family:var(--f-mono);font-size:.8rem;background:color-mix(in oklab,var(--seq-hi) var(--p),var(--surface))!important;min-width:58px;border-left:2px solid var(--surface)}
td.heat.hi{color:var(--on-seq)}
td.heat.zero{color:var(--muted)}
td.heat small{font-size:.68rem;opacity:.8;margin-left:3px}
.est{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;white-space:nowrap}
.est::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.est.ter{color:var(--good-ink)} .est.ter::before{background:currentColor}
.est.eje{color:var(--accent)} .est.eje::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.est.sin{color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters .field{min-width:130px;flex:1}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.84rem;font-weight:500;color:var(--ink-2)}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=number],input[type=date],select,textarea{border:1.5px solid var(--line-2);background:var(--surface);padding:9px 10px;border-radius:4px;width:100%;min-width:0}
input[type=file]{font-size:.85rem;max-width:100%}
textarea{resize:vertical;min-height:64px}
textarea.code{font-family:var(--f-mono);font-size:.82rem;min-height:120px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.btn{border:1.5px solid var(--ink);background:var(--surface);padding:10px 16px;border-radius:4px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);padding:12px 20px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 10px;font-size:.84rem;font-weight:500;border-width:1px}
.btn.ghost{border-color:var(--line-2)}
.warnline{color:var(--warn-ink);font-size:.86rem}
.summary{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;font-size:.95rem}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1.5px solid var(--line-2);background:var(--surface);padding:9px 0;width:58px;font-family:var(--f-mono);font-weight:600;border-radius:4px}
.quick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.steps{display:flex;flex-direction:column;gap:14px}
.step{background:var(--surface);border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.step.off{opacity:.55}
.step-h{display:flex;align-items:center;gap:12px}
.step-n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem;flex:none}
.step.done .step-n{background:var(--ink);color:var(--bg)}
.step-h .hint{font-size:.85rem;color:var(--ink-2)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opt{border:1.5px solid var(--line-2);background:var(--surface);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;border-radius:4px}
.opt:hover{border-color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .t{font-weight:600;display:flex;align-items:center;gap:8px}
.opt .s{font-size:.8rem;color:var(--ink-2)}
.grp{display:flex;flex-direction:column;gap:6px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;max-height:420px;overflow:auto;padding:2px}
.u{position:relative;border:1.5px solid var(--line-2);background:var(--surface);padding:7px 8px 11px;border-radius:4px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;overflow:hidden;text-align:left}
.u .id{font-family:var(--f-mono);font-weight:600;font-size:.82rem}
.u .up{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-2)}
.u::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:var(--p);background:var(--seq-hi)}
.u[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.u[aria-pressed="true"] .id::before{content:"✓ ";color:var(--accent)}

.cmap{display:flex;flex-direction:column;gap:14px}
.frow{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.fund{border:1.5px solid var(--ink);background:var(--surface);padding:10px;width:min(250px,100%);display:flex;flex-direction:column;gap:8px}
.fund .fh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.fund .fh b{font-family:var(--f-mono)}
.patas{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pata{border:1px solid var(--line-2);background:color-mix(in oklab,var(--seq-hi) var(--p),var(--surface-2));padding:7px 8px;display:flex;flex-direction:column;gap:2px;min-height:78px;text-align:left}
.pata.hi{color:var(--on-seq)}
.pata .pl{font-family:var(--f-disp);font-weight:600;font-size:.85rem}
.pata .pv{font-family:var(--f-mono);font-weight:600;font-size:1.05rem}
.pata .ps{font-size:.72rem;opacity:.85;line-height:1.25}
.canal{padding:14px;text-align:center;font-family:var(--f-disp);font-weight:600;letter-spacing:.3em;color:var(--accent);background:var(--water);border-block:1px dashed var(--accent);font-size:.9rem;display:flex;flex-direction:column;gap:6px;align-items:center}
.steps-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 16px;font-size:.82rem;color:var(--ink-2)}
.steps-legend span{display:flex;gap:8px;align-items:center}
.steps-legend i{font-style:normal;font-family:var(--f-mono);width:24px;height:18px;display:grid;place-items:center;font-size:.72rem;background:color-mix(in oklab,var(--seq-hi) var(--p),var(--surface-2));border:1px solid var(--line-2)}
.steps-legend i.hi{color:var(--on-seq)}

.scrim{position:fixed;inset:0;background:rgba(10,16,20,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1.5px solid var(--ink);z-index:31;display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.dh h2{font-size:1.4rem}
.db{overflow:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:16px}
.xbtn{border:1px solid var(--line-2);background:var(--surface);width:36px;height:36px;border-radius:50%;font-size:1.1rem;flex:none}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:.84rem}
.meta div{display:flex;flex-direction:column}
.meta span{color:var(--muted);font-size:.72rem;font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.06em}
.rings{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.agrp{display:flex;flex-direction:column;gap:4px}
.agrp h3{display:flex;justify-content:space-between;gap:8px;font-size:.95rem;padding-bottom:4px;border-bottom:1px solid var(--line)}
.arow{all:unset;display:grid;grid-template-columns:1fr 92px 42px;gap:8px;align-items:center;padding:6px 4px;border-radius:4px;cursor:pointer;font-size:.86rem}
.arow:hover{background:var(--surface-2)}
.arow:focus-visible{outline:2px solid var(--accent)}
.arow[disabled]{cursor:default}
.arow .ab{height:8px;background:var(--surface-3);border-radius:2px;position:relative;overflow:hidden}
.arow .ab i{position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--c,var(--seq-hi))}
.arow .av{font-family:var(--f-mono);text-align:right;font-size:.8rem}
.arow.z .an{color:var(--muted)}
.qe{background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;margin:2px 0 6px}
.qe .form-grid{grid-template-columns:1fr 1fr}
.cgrid{display:grid;grid-template-columns:92px repeat(3,minmax(0,1fr));gap:4px;align-items:center;padding:6px 4px;border:1px solid var(--line);border-radius:6px;margin:2px 0}
.cgrid .cf{border:1.5px solid var(--line-2);border-radius:4px;padding:8px 2px;font-family:var(--f-mono);font-size:.8rem;font-weight:600;background:color-mix(in oklab,var(--vano-hi) var(--p),var(--surface))}
.cgrid .cf.hi{color:#fff}
.cgrid .cf.on,.cgrid .cf[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.cgrid .cf:disabled{cursor:default}
.cgrid .cf.sel{background:var(--accent-soft);color:var(--ink)}
.cgrid.wt{grid-template-columns:84px repeat(3,minmax(0,1fr)) 58px}
.cgrid .ctot{font-family:var(--f-mono);font-size:.8rem;font-weight:600;text-align:right}
.cgrid .ctot.ok{color:var(--good-ink)}
.tabs2{display:flex;gap:4px;flex-wrap:wrap}
.tabs2 button{border:1px solid var(--line-2);background:var(--surface);padding:5px 12px;border-radius:999px;font-size:.84rem}
.tabs2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Subestación Tineo */
.plan-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.plan-svg{display:block;width:100%;height:auto;min-width:720px}
.plan-svg .ax{stroke:var(--line-2);stroke-width:1;stroke-dasharray:12 5 2 5}

.plan-svg .zt{font-family:var(--f-disp);font-weight:600;font-size:13px;letter-spacing:.06em;fill:var(--muted);text-transform:uppercase}
.sef{cursor:pointer;outline:none}
.sef .o{fill:var(--surface);stroke:none}
.sef .fl{fill:var(--fill-ok)}
.sef .o2{fill:none;stroke:var(--ink-2);stroke-width:1.6}
.sef.ok .o{fill:var(--good)}
.sef.ok .o2{stroke:var(--good-ink)}
.sef:hover .o2,.sef:focus-visible .o2{stroke:var(--accent);stroke-width:2.6}
.sef.sel .o2{stroke:var(--accent);stroke-width:3.2}
.sef .pt{font-family:var(--f-mono);font-weight:600;fill:var(--ink)}
.sef.ok .pt{fill:#fff}
.sef .lb{font-family:var(--f-mono);font-weight:600;font-size:12px;fill:var(--ink-2)}
.sef.ok .lb{fill:var(--good-ink)}
.grpstats{display:flex;flex-wrap:wrap;gap:8px}
.grpstats span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;color:var(--ink-2);background:var(--surface)}
.grpstats span.done{border-color:var(--good-ink);color:var(--good-ink);font-weight:600}
/* Liberaciones */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.crit,.tmfig>div.crit b{color:var(--crit-ink)}
.lst{--c:var(--lib-pend);display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;line-height:1;padding:4px 8px 4px 7px;border-radius:3px;border:1px solid color-mix(in oklab,var(--c) 55%,transparent);color:color-mix(in oklab,var(--c) 78%,var(--ink));background:color-mix(in oklab,var(--c) 11%,var(--surface));white-space:nowrap}
.lst::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.lst.na{border-style:dashed;background:var(--surface)}
.lgen{--c:var(--lib-pend);display:inline-flex;align-items:center;gap:7px;font-family:var(--f-disp);font-weight:600;font-size:.86rem;color:color-mix(in oklab,var(--c) 82%,var(--ink));white-space:nowrap}

.ckb{width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:3px;background:var(--surface);padding:0;display:inline-grid;place-items:center;vertical-align:middle}
.ckb:hover{border-color:var(--ink-2)}
.ckb[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.ckb[aria-checked="true"]::after{content:"";width:8px;height:4px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.ckb[aria-checked="mixed"]::after{content:"";width:8px;height:2px;background:var(--accent)}
.ibtn{border:1px solid var(--line-2);background:var(--surface);width:30px;height:30px;border-radius:4px;display:inline-grid;place-items:center;color:var(--ink-2);padding:0}

.libbulk{display:flex;flex-wrap:wrap;gap:10px;align-items:end;border:1px solid var(--accent);background:var(--accent-soft);padding:10px 12px}

.lsel button{display:inline-flex;align-items:center;gap:6px}
.lsel .ldot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.libnota{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}

.libnota .btn{align-self:flex-start}
.frentes{display:flex;flex-wrap:wrap;gap:6px}
.frentes span{border:1px solid color-mix(in oklab,var(--lib-ok) 50%,var(--line));background:color-mix(in oklab,var(--lib-ok) 8%,var(--surface));padding:4px 9px;font-size:.8rem;font-family:var(--f-mono);border-radius:3px}
.lsym{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--g);border:2px solid #fff;box-shadow:0 0 0 1px rgba(10,16,20,.6);flex:none}
.lsym.sq{border-radius:2px}
.libmap-slot{position:relative;z-index:0;isolation:isolate;height:clamp(420px,64vh,660px);border:1px solid var(--line-2);background:#1f2930;overflow:hidden}
.libmap{position:absolute;inset:0}
.libmap.leaflet-container{font-family:var(--f-body);background:#1f2930}
.libmap-load{position:absolute;inset:0;display:grid;place-items:center;color:#c9d3d9;font-size:.9rem}
.libmap .leaflet-control-attribution{font-size:10px}

.libmap-n{background:rgba(255,255,255,.92);padding:4px 5px 3px;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.3);line-height:0}

.lmk-w{background:none;border:0}
.lmk{position:relative;display:block;width:14px;height:14px;--g:#97a3ac}
.lmk i{position:absolute;left:1px;top:1px;width:12px;height:12px;border-radius:50%;background:var(--g);border:2px solid #fff;box-shadow:0 0 0 1px rgba(10,16,20,.75),0 1px 3px rgba(0,0,0,.45)}

.lmk.g-apta{--g:#1f9d48}.lmk.g-proc{--g:#e8a317}.lmk.g-res{--g:#d63b2f}.lmk.g-pend{--g:#97a3ac}

.libmap.z10 .lmk b.l50,.libmap.z12 .lmk b.l10,.libmap.z12 .lmk b.l50,.libmap.z14 .lmk b{display:block}
.libpop .leaflet-popup-content-wrapper,.libpop .leaflet-popup-tip{background:var(--surface);color:var(--ink);border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.3)}

.lpop{display:flex;flex-direction:column;gap:7px}
.lpop-h b{display:block;font-family:var(--f-disp);font-size:1.05rem}
.lpop-h span{font-size:.78rem;color:var(--muted)}
.lpop-r{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.84rem}
.lpop-o{font-size:.82rem;border-left:2px solid var(--line-2);padding-left:8px;color:var(--ink-2)}
.lpop-o span{display:block;font-size:.72rem;color:var(--muted)}
.lpop-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}

.lpop-c{margin-top:-3px}
.pcods{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}

.pcods i.ok{border-color:color-mix(in oklab,var(--lib-ok) 55%,transparent);background:color-mix(in oklab,var(--lib-ok) 14%,var(--surface));color:color-mix(in oklab,var(--lib-ok) 72%,var(--ink))}

.pmflist{display:flex;flex-direction:column;border:1px solid var(--line);margin-top:6px}
.pmfr{display:flex;flex-direction:column;gap:3px;padding:8px 10px;border-top:1px solid var(--line)}
.pmfr:first-child{border-top:0}

  const known=vs.filter(v=>v.len!=null);const wDef=known.length?known.reduce((x,v)=>x+v.len,0)/known.length:1;let WV=0;
  for(const v of vs){const p=gPct(get,v.key,"tva");byV[v.key]=p;const w=v.len!=null?v.len:wDef;WV+=w;vs2+=w*p;if(p>=99.95)vdone++;}
  const T=acc.tto/n,V=WV?vs2/WV:0;const sp=tenSplit();
  const stg={pre:acc.pre/n,fun:acc.fun/n,mon:acc.mon/n,ten:(sp.t*T+(vs.length?sp.v*V:0))/(sp.t+(vs.length?sp.v:0)),tenT:T,tenV:V};
  let W=0,P=0;for(const et of etapas()){const w=num(et.peso,0);W+=w;P+=w*(stg[et.id]||0);}
  return {stg,pct:W?P/W:0,cnt,byE,byV,ind,n:es.length,nv:vs.length,vdone,has:es.length>0};

function progress(get){const out={sec:{},total:0};let W=0,P=0;for(const s of secs()){const r=calcSec(get,s.id);out.sec[s.id]=r;if(r.has){W+=s.peso;P+=s.peso*r.pct;}}

  const se=seCalc(get);out.se=se;const ws=pesoSE();if(ws>0){W+=ws;P+=ws*se.total;}
  out.lineaPct=(()=>{let w=0,p=0;for(const s of secs()){const r=out.sec[s.id];if(r.has){w+=s.peso;p+=s.peso*r.pct;}}return w?p/w:0;})();
  out.total=W?P/W:0;return out;}

/* ===================== Modelos SVG (esquemas sin escala) ===================== */
const f1=n=>(Math.round(n*10)/10).toString();
let CLIPN=0;
/* Torre de doble circuito en disposición vertical, en elevación: circuito 1 a la izquierda y circuito 2 a la derecha,
   cada uno con sus tres fases en altura; OPGW en la cúspide. Nivel k: 0 = inferior (fase A), 1 = media (B), 2 = superior (C).
   arms.L/R[k] = amarre del conductor (bajo la cadena); arms.LT/RT[k] = punta de la cruceta */
const LVL=[0.64,0.76,0.88],ARM_F=[0.92,1,0.85];
function latticeGeom(cx,gy,H,wb,wt,panels,anc,o){o=o||{};
  const yW=gy-H*0.58,yT=gy-H*0.93,yH=gy-H;const P=(x,y)=>f1(x)+" "+f1(y);const s=[];
  const lx=y=>cx-(wb-(wb-wt)*(gy-y)/(gy-yW)),rx=y=>cx+(wb-(wb-wt)*(gy-y)/(gy-yW));
  /* cuerpo troncocónico con diagonales en X */
  s.push(`M${P(cx-wb,gy)}L${P(cx-wt,yW)}M${P(cx+wb,gy)}L${P(cx+wt,yW)}`);
  for(let i=0;i<panels;i++){const y0=gy-(gy-yW)*i/panels,y1=gy-(gy-yW)*(i+1)/panels;s.push(`M${P(lx(y0),y0)}L${P(rx(y1),y1)}M${P(rx(y0),y0)}L${P(lx(y1),y1)}M${P(lx(y1),y1)}L${P(rx(y1),y1)}`);}
  /* fuste recto donde se apoyan las crucetas, con diagonales entre niveles, y cúspide del OPGW */
  const ys=[yW,...LVL.map(f=>gy-H*f),yT];
  s.push(`M${P(cx-wt,yW)}V${f1(yT)}M${P(cx+wt,yW)}V${f1(yT)}`);
  for(let i=0;i<ys.length-1;i++)s.push(`M${P(cx-wt,ys[i])}L${P(cx+wt,ys[i+1])}M${P(cx+wt,ys[i])}L${P(cx-wt,ys[i+1])}`);
  s.push(`M${P(cx-wt,yT)}H${f1(cx+wt)}M${P(cx-wt,yT)}L${P(cx,yH)}L${P(cx+wt,yT)}`);
  /* crucetas: cordón horizontal y diagonal inferior hasta la punta; la media es la más larga (torre tipo barril).
     o.noIns: las cadenas de aisladores se dibujan aparte (vestido); o.armK: largo de cruceta en múltiplos de wt */
  const arms={L:[],R:[],LT:[],RT:[]};const ins=Math.max(3.5,H*0.05);const ak=o.armK||(anc?2.9:2.6);const ad=H*0.035;
  LVL.forEach((f,k)=>{const y=gy-H*f;const L=wt*(1+ak*ARM_F[k]);
    s.push(`M${P(cx-L,y)}L${P(cx+L,y)}M${P(cx-wt,y+ad)}L${P(cx-L,y)}M${P(cx+wt,y+ad)}L${P(cx+L,y)}`);
    if(!o.noIns)s.push(`M${P(cx-L,y)}L${P(cx-L,y+ins)}M${P(cx+L,y)}L${P(cx+L,y+ins)}`);
    arms.L.push({x:cx-L,y:y+ins});arms.R.push({x:cx+L,y:y+ins});arms.LT.push({x:cx-L,y});arms.RT.push({x:cx+L,y});});
  return {d:s.join(""),arms,peak:{x:cx,y:yH},reach:Math.max(wb,wt*(1+ak)+2),ins};
}
/* Torre simplificada para perfiles largos: cuerpo, cúspide y tres crucetas por lado. arm0/arm/arm2 = nivel inferior/medio/superior */
function glyphD(cx,gy,h,b,anc){const t=b*0.32,yW=gy-h*0.6,yT=gy-h*0.93,yH=gy-h;
  const lv=LVL.map((f,k)=>({y:gy-h*f,L:t+b*(anc?1.05:0.9)*ARM_F[k]}));
  let d=`M${f1(cx-b)} ${f1(gy)}L${f1(cx-t)} ${f1(yW)}V${f1(yT)}L${f1(cx)} ${f1(yH)}L${f1(cx+t)} ${f1(yT)}V${f1(yW)}L${f1(cx+b)} ${f1(gy)}`;
  for(const a of lv)d+=`M${f1(cx-a.L)} ${f1(a.y)}H${f1(cx+a.L)}`;
  if(b>=2.4){const ym=gy-h*0.3,wm=b-(b-t)*0.5;d+=`M${f1(cx-b)} ${f1(gy)}L${f1(cx+wm)} ${f1(ym)}M${f1(cx+b)} ${f1(gy)}L${f1(cx-wm)} ${f1(ym)}M${f1(cx-wm)} ${f1(ym)}L${f1(cx+t)} ${f1(yW)}M${f1(cx+wm)} ${f1(ym)}L${f1(cx-t)} ${f1(yW)}`;}
  const at=k=>({L:{x:cx-lv[k].L,y:lv[k].y},R:{x:cx+lv[k].L,y:lv[k].y}});
  return {d,arm0:at(0),arm:at(1),arm2:at(2)};}
/* Estructura montada: trazo fantasma completo + trazo sólido recortado desde el suelo según el % de montaje */
function steelDraw(d,cx,gy,top,reach,p,sw){const st=sw?` style="stroke-width:${sw}"`:"";
  if(p>=99.95)return `<path class="steel"${st} d="${d}"/>`;
  if(p<=0)return `<path class="ghost" d="${d}"/>`;
  const id="ck"+(CLIPN++);const hh=(gy-top+6)*clamp(p,0,100)/100;
  return `<path class="ghost" d="${d}"/><clipPath id="${id}"><rect x="${f1(cx-reach-4)}" y="${f1(gy+2-hh)}" width="${f1(2*reach+8)}" height="${f1(hh+2)}"/></clipPath><path class="steel"${st} clip-path="url(#${id})" d="${d}"/>`;}
/* Relleno ascendente genérico */
function clipUp(inner,x,y,w,h,p){if(p<=0)return "";if(p>=99.95)return inner;const id="ck"+(CLIPN++);const hh=h*clamp(p,0,100)/100;return `<clipPath id="${id}"><rect x="${f1(x)}" y="${f1(y+h-hh)}" width="${f1(w)}" height="${f1(hh+0.5)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`;}
/* Fundación en corte (dado + zapata), hormigonada desde abajo según el % */
function footDraw(cx,gy,w,h,p){const pw=w*0.38,ph=h*0.55,fh=h-ph;
  const shp=`M${f1(cx-pw/2)} ${f1(gy)}h${f1(pw)}v${f1(ph)}h${f1((w-pw)/2)}v${f1(fh)}h${f1(-w)}v${f1(-fh)}h${f1((w-pw)/2)}Z`;
  return `<path class="pad" d="${shp}"/>`+clipUp(`<path class="conc" d="${shp}"/>`,cx-w/2-1,gy,w+2,h,p)+`<path d="${shp}" style="fill:none;stroke:var(--ink-2);stroke-width:.8"/>`;}
/* Fundación en corte según su tipo: zv/cr = zapata con pedestal y stub; pila = pila con cabezal;
   amet/ahor = anclas helicoidales con cabezal metálico o de hormigón. Lo construido sube desde el fondo según el % */
function footModel(cx,gy,w,d,type,p){
  const up=Math.min(2,d*0.1),P=(x,y)=>f1(x)+" "+f1(y);let shp="",sol="",gh="";
  if(type==="amet"||type==="ahor"){const met=type==="amet";const cw=w*(met?0.8:0.92),ch=d*(met?0.12:0.3),yt=gy-up;let sh="",hx="";
    for(const sx of [-1,1]){const x0=cx+sx*w*0.14,y0=yt+ch,x1=cx+sx*w*0.46,y1=gy+d;sh+=`M${P(x0,y0)}L${P(x1,y1)}`;
      const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,hl=w*0.13;
      for(const t of [0.62,0.88]){const px=x0+dx*t,py=y0+dy*t;hx+=`M${P(px-nx*hl,py-ny*hl)}L${P(px+nx*hl,py+ny*hl)}`;}}
    const cap=`x="${f1(cx-cw/2)}" y="${f1(yt)}" width="${f1(cw)}" height="${f1(ch+up)}"`;
    gh=`<path class="ghost" d="${sh}${hx}"/><rect class="padw" ${cap}/>`;
    sol=`<path class="steel" d="${sh}"/><path class="steel" style="stroke-width:1.4" d="${hx}"/><rect class="${met?"steelf":"conc"}" ${cap}/>`;}

function drillHtml(et,list){

/* Tendido en metros reales: longitud de cada vano (actualización de terreno) × avance registrado de cada cable en ese vano.

function tendMetros(){
  const F=S.dashF;const z=()=>({n:0,L:0,eq:0,c1:0,c2:0,og:0,nb:0,mb:0,nt:0,mt:0});const T=z();const bySec=[];const grp=new Map();const sin=[];
  for(const s of scopeSecs()){const r=S.P.sec[s.id];const x=Object.assign(z(),{s});
    for(const v of vanos(s.id)){const eb=estById(s.id,v.b)||{};if(F.contr&&eb.contr!==F.contr)continue;x.n++;
      const q={v,p1:circPct(v.key,"1"),p2:circPct(v.key,"2"),po:cur(v.key,"tv_opg"),pv:r.byV[v.key]||0};q.both=q.p1>=99.95&&q.p2>=99.95;
      const gk=s.id+"|"+(v.tt||"");if(!grp.has(gk))grp.set(gk,{s,tt:v.tt||"Sin tramo",vs:[]});grp.get(gk).vs.push(q);
      if(v.len==null){sin.push(v.label);continue;}const L=v.len;x.L+=L;x.eq+=L*q.pv/100;
      x.c1+=L*q.p1/100;x.c2+=L*q.p2/100;x.og+=L*q.po/100;if(q.both){x.nb++;x.mb+=L;}if(q.pv>=99.95){x.nt++;x.mt+=L;}}
    if(x.n){bySec.push(x);for(const k in T)T[k]+=x[k];}}
  /* tramos acotados al avance: solo los tramos continuos de vanos que tienen algún avance de tendido, separados por tramo de tendido */
  const many=scopeSecs().length>1;const tram=[],sinAv=[];const TT=z();
  for(const g of grp.values()){const lab=g.tt+(many?" · "+g.s.nombre:"");let run=null;const n0=tram.length;
    for(const q of g.vs){if(q.pv<=0&&q.p1+q.p2+q.po<=0){run=null;continue;}
      if(!(run&&run.b===q.v.a)){run=Object.assign(z(),{lab,a:q.v.a,b:q.v.b,sinL:false,okAll:true,okC:true});tram.push(run);}
      const l=q.v.len||0;run.b=q.v.b;run.n++;run.L+=l;run.eq+=l*q.pv/100;run.c1+=l*q.p1/100;run.c2+=l*q.p2/100;run.og+=l*q.po/100;
      if(q.both){run.nb++;run.mb+=l;}if(q.v.len==null)run.sinL=true;if(!q.both)run.okC=false;if(!(q.both&&q.po>=99.95))run.okAll=false;}
    if(tram.length===n0)sinAv.push(lab);}
  for(const t of tram)for(const k of ["n","L","eq","c1","c2","og","nb","mb"])TT[k]+=t[k];
  const pc=(a,b)=>b?fmtP(a/b*100,1):"—";
  const fig=(t,v,sub)=>`<div><span>${t}</span><b class="num">${v}</b><span>${sub}</span></div>`;
  const tr=(x,lab,b)=>`<tr><td>${b?`<b>${lab}</b>`:lab}</td><td class="r num">${x.L?fmtM(x.L):"sin longitud"}</td><td class="r num"><b>${pc(x.eq,x.L)}</b></td><td class="r num">${fmtM(x.c1)}</td><td class="r num">${fmtM(x.c2)}</td><td class="r num">${fmtM(x.og)}</td><td class="r num"><b>${fmtM(x.mb)}</b> <span class="muted">· ${x.nb} vanos</span></td><td class="r num">${fmtM(x.mt)} <span class="muted">· ${x.nt} vanos</span></td></tr>`;
  const trT=t=>`<tr><td><b>${esc(t.lab)}</b></td><td class="mono small">${esc(t.a)} – ${esc(t.b)}</td><td class="r num">${t.n}</td><td class="r num">${t.sinL&&!t.L?"sin longitud":fmtM(t.L)}</td><td class="r num"><b>${pc(t.eq,t.L)}</b></td><td class="r num">${fmtM(t.c1)}</td><td class="r num">${fmtM(t.c2)}</td><td class="r num">${fmtM(t.og)}</td><td class="r num"><b>${fmtM(t.mb)}</b></td><td class="small">${t.okAll?"Tendido (conductores y OPGW)":t.okC?"Conductores tendidos":"En tendido"}</td></tr>`;
  let h=`<section class="panel stack"><h2>Tendido en metros</h2>
  <div class="tmfig">${fig("Avance del tendido",pc(T.eq,T.L),`medido por distancia en ${fmtKm(T.L)} de vanos`)}${fig("Conductor circuito 1",fmtM(T.c1),`${pc(T.c1,T.L)} de ${fmtM(T.L)}`)}${fig("Conductor circuito 2",fmtM(T.c2),`${pc(T.c2,T.L)} de ${fmtM(T.L)}`)}${fig("OPGW",fmtM(T.og),`${pc(T.og,T.L)} de ${fmtM(T.L)}`)}${fig("Vanos tendidos",fmtM(T.mb),`${T.nb} de ${T.n} vanos con ambos circuitos`)}</div>
  <div class="tbl-wrap"><table class="tec"><thead><tr><th>Sector</th><th class="r">Longitud</th><th class="r">Avance tendido</th><th class="r">Conductor C1</th><th class="r">Conductor C2</th><th class="r">OPGW</th><th class="r">Vanos tendidos</th><th class="r">Vanos terminados</th></tr></thead><tbody>
  ${bySec.map(x=>tr(x,esc(x.s.nombre))).join("")}${bySec.length>1?tr(T,"Total línea",1):""}</tbody></table></div>
  <h3 style="margin:4px 0 0">Tramos con tendido</h3>
  ${tram.length?`<div class="tbl-wrap"><table class="tec"><thead><tr><th>Tramo de tendido</th><th>Estructuras con avance</th><th class="r">Vanos</th><th class="r">Longitud</th><th class="r">Avance</th><th class="r">Conductor C1</th><th class="r">Conductor C2</th><th class="r">OPGW</th><th class="r">Vanos tendidos</th><th>Estado</th></tr></thead><tbody>
  ${tram.map(trT).join("")}<tr><td><b>Total</b></td><td class="small">${tram.length} ${tram.length===1?"tramo":"tramos"}</td><td class="r num"><b>${TT.n}</b></td><td class="r num"><b>${fmtM(TT.L)}</b></td><td class="r num"><b>${pc(TT.eq,TT.L)}</b></td><td class="r num"><b>${fmtM(TT.c1)}</b></td><td class="r num"><b>${fmtM(TT.c2)}</b></td><td class="r num"><b>${fmtM(TT.og)}</b></td><td class="r num"><b>${fmtM(TT.mb)}</b></td><td></td></tr></tbody></table></div>`:`<p class="muted small" style="margin:0">Aún no hay tendido registrado${F.contr?" para este contratista":""}.</p>`}
  <p class="small muted" style="margin:0">Avance del tendido = Σ longitud del vano × avance del vano (piloto, conductores, OPGW, flechado y accesorios) ÷ longitud total. Conductor y OPGW = longitud × avance registrado de cada cable (conductor: promedio de sus tres fases). Vanos tendidos = vanos con las seis fases al 100 %; vanos terminados = todo el tendido al 100 %.${sinAv.length?` Sin tendido: ${esc(sinAv.join(", "))}.`:""}${sin.length?` Sin longitud (no se suman): ${esc(sin.join(", "))}.`:""}</p></section>`;
  return h;}

    if(nf)toast(`Guardado en el historial (${a.nombre} ${fmtP(E.pct,E.pct%1!==0)} en ${donde}), pero el avance vigente no cambia: ya hay un registro con fecha posterior (${fmtD(nf)}).`,true);

function grpFor(etapa,sec){if(etapa==="pre")return "pre";if(etapa==="mon")return "mon";if(etapa==="fun"&&sec==="cruce")return "cr";return null;}
function unitsFor(r,all){
  if(!r.sec||!r.grp)return [];
  const q=(r.q||"").trim().toLowerCase();
  if(r.sec==="se"){const cat=r.grp.slice(3);let its=seItems(cat);if(!all&&q)its=its.filter(i=>i.id.toLowerCase().includes(q)||i.desc.toLowerCase().includes(q));
    return its.map(i=>({uid:i.id,label:i.id,sub:SE_GRP[i.grp]||"",key:kSE(cat,i.id),meta:{kind:"se",unidad:i.id,cat}}));}
  if(r.grp==="tva"){let vs=vanos(r.sec);if(!all){if(r.tt)vs=vs.filter(v=>v.tt===r.tt);if(q)vs=vs.filter(v=>v.label.toLowerCase().includes(q));}
    return vs.map(v=>({uid:v.a+">"+v.b,label:v.label,sub:(v.tt||"").replace("Tramo ","T"),key:v.key,meta:{kind:"vano",unidad:v.label,a:v.a,b:v.b}}));}
  if(r.grp==="cr")return estr("cruce").flatMap(e=>patas(e.id).map(p=>({uid:e.id+"|"+p.pata,label:e.id+"·"+p.pata,sub:"Torre "+(e.torre||e.id),key:kP("cruce",e.id,p.pata),meta:{kind:"pata",unidad:e.id,pata:p.pata}})));
  let es=estr(r.sec);
  if(!all){if(FUNG.includes(r.grp)&&!r.verTodas)es=es.filter(e=>!e.fund||e.fund===r.grp);if(r.tt)es=es.filter(e=>e.tt===r.tt);if(q)es=es.filter(e=>String(e.id).toLowerCase().includes(q));}
  return es.map(e=>({uid:e.id,label:e.id,sub:(e.tt||"").replace("Tramo ","T")+(e.tipo?" · "+e.tipo.slice(0,4)+".":""),key:kE(r.sec,e.id),meta:{kind:"est",unidad:e.id}}));
}

async function guardar(){
  const r=S.reg;const aids=regAids(r);if(S.saving)return;
  {const pi=$("#r-pct"),fi=$("#r-fecha"),oi=$("#r-obs");if(pi&&pi.value!==""){const v=num(pi.value,NaN);if(isFinite(v))r.pct=pctIn(v);}if(fi&&fi.value)r.fecha=fi.value;if(oi)r.obs=oi.value;}
  if(r.act==="__cond"&&!aids.length){toast("Elige al menos una fase del conductor.",true);return;}
  const act=r.act==="__cond"?{id:aids,nombre:"Tendido de conductor ("+aids.length+" fase"+(aids.length>1?"s":"")+")"}:actById(r.act);
  if(!act||!r.sec||!r.sel.size)return;
  if(!(r.pct>=0&&r.pct<=100)){toast("El avance debe estar entre 0 y 100%.",true);return;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(r.fecha)||r.fecha>today()){toast("Revisa la fecha: no puede ser futura.",true);return;}
  const byUid=new Map(unitsFor(r,true).map(u=>[u.uid,u]));
  const ids=Array.isArray(act.id)?act.id:[act.id];
  const atras=[...r.sel].filter(uid=>{const u=byUid.get(uid);return u&&newerFecha(u.key,ids,r.fecha);});
  S.saving=true;render();const ts=Date.now();let ok=0,err=null;const hechos=new Set();
  for(const uid of r.sel){const u=byUid.get(uid);if(!u)continue;try{await saveOne(u.key,r.sec,u.meta,act.id,r.pct,r.fecha,r.obs,ts);ok++;hechos.add(uid);}catch(e){err=e;break;}}
  S.saving=false;
  /* lo ya guardado se quita de la selección para no duplicarlo al reintentar */
  r.sel=new Set([...r.sel].filter(uid=>!hechos.has(uid)));
  if(err){saveErr(err,ok,ok+r.sel.size);render();return;}
  const word=r.sec==="se"?"elemento(s)":r.grp==="tva"?"vano(s)":r.grp==="cr"?"pata(s)":"estructura(s)";
  if(atras.length)toast(`Guardado en ${ok} ${word}. Atención: en ${atras.length} ya había un registro con fecha posterior, así que su avance vigente no cambió (queda en el historial).`,true);
  else toast(`Avance guardado: ${act.nombre} ${fmtP(r.pct,r.pct%1!==0)} en ${ok} ${word}.`);
  r.obs="";render();
}

/* ---------- Liberaciones: PMF y servidumbre por torre y por vano ---------- */
/* Se guardan con la misma función segura de los avances (registrar_avance), en documentos "lib__…" de la tabla avance:
   act.pmf / act.ser = estado vigente {est, fecha, ref, obs}; hist = bitácora (cambios de estado y observaciones).
   Una torre o vano queda apto para construcción con PMF y servidumbre liberados o "no aplica". */
const LIB_VARS=[{id:"pmf",t:"PMF",h:"PMF"},{id:"ser",t:"Servidumbre",h:"Servidumbre (propietarios)"}];
const LIB_EST={pend:{t:"Pendiente",c:"var(--lib-pend)",p:0},tram:{t:"En trámite",c:"var(--lib-tram)",p:50},lib:{t:"Liberado",c:"var(--lib-ok)",p:100},na:{t:"No aplica",c:"var(--lib-na)",p:100},res:{t:"Restringido",c:"var(--lib-res)",p:25}};

const estTxt=(vid,e)=>e==="lib"?(vid==="pmf"?"Aprobado":vid==="ser"?"Liberado":"Liberado / aprobado"):(LIB_EST[e]||LIB_EST.pend).t;

/* Estado inicial: planilla "estado PMF" al 22-10-2026 (PMF asociados, estado del PMF y propietarios = servidumbre).

  const cd=s=>String(s).replace(/]]>/g,"]]]]><![CDATA[>");const kc=h=>"ff"+h.slice(5,7)+h.slice(3,5)+h.slice(1,3);const us=libUnits();

/* ---------- Importador de matrices ---------- */
function pv(s){s=String(s==null?"":s).trim();if(!s)return 0;const pc=s.includes("%");const n=num(s.replace("%","").replace(/\s/g,""),0);if(!pc&&n>0&&n<=1&&/[.,]/.test(s))return Math.round(n*1000)/10;return clamp(n,0,100);}
const splitRows=t=>t.replace(/^﻿/,"").split(/\r?\n/).map(l=>l.split(";"));
function fundOf(txt){const t=String(txt||"").toLowerCase();if(t.includes("metal"))return "amet";if(t.includes("hormig"))return "ahor";if(t.includes("zapata"))return "zv";if(t.includes("pila"))return "pila";return null;}
function parseGeneral(txt){
  const rows=splitRows(txt);const hi=rows.findIndex(r=>/^n\W*\s*estructura/i.test((r[0]||"").trim()));
  if(hi<0||rows[hi].length<49)throw new Error("La matriz general no tiene el formato esperado (falta la fila 'N Estructura'). Revisa que el CSV use punto y coma.");
  const est=[],vals=new Map(),seen=new Set();const chk={n:0,bad:[]};
  for(let i=hi+1;i<rows.length;i++){const r=rows[i];const id=(r[0]||"").trim();const zona=(r[2]||"").trim();const sec=ZONA[zona.toLowerCase()];
    if(!id||!sec||seen.has(id))continue;seen.add(id);
    const fund=sec==="cruce"?null:fundOf(r[55]);
    est.push({id,sec,zona,torre:(r[1]||"").trim(),tt:(r[3]||"").trim(),tipo:(r[4]||"").trim().replace("Suspension","Suspensión"),contr:CONTR_SECTOR[sec]||(r[5]||"").trim(),fund});
    const a={};for(const [c,aid] of Object.entries(COLS_G)){const ci=+c;if(sec==="cruce"&&ci>=12&&ci<=40)continue;const v=pv(r[ci]);if(v>0)a[aid]=v;}
    vals.set(kE(sec,id),{meta:{sector:sec,unidad:id,kind:"est"},acts:a});
    if(sec!=="cruce"){const get=(k,x)=>a[x]||0;let f=0;for(const g of FUNG)f=Math.max(f,gPct(get,"",g));const m=gPct(get,"","mon");chk.n++;if(Math.abs(f-pv(r[42]))>0.6||Math.abs(m-pv(r[48]))>0.6)chk.bad.push(id);}
  }
  if(!est.length)throw new Error("No se encontraron estructuras en la matriz general.");
  return {est,vals,chk};
}
function parseCruce(txt){
  const rows=splitRows(txt);const hi=rows.findIndex(r=>(r[3]||"").trim().toLowerCase()==="pata"&&/estructura/i.test(r[1]||""));
  if(hi<0)throw new Error("La matriz del cruce no tiene el formato esperado.");
  const pts=[],vals=new Map();const chk={n:0,bad:[]};
  for(let i=hi+1;i<rows.length;i++){const r=rows[i];const c0=(r[0]||"").trim();if(/^resumen/i.test(c0))break;
    const est=(r[1]||"").trim(),pata=(r[3]||"").trim().toUpperCase();if(!/^\d+$/.test(c0)||!est||!/^[A-D]$/.test(pata))continue;
    pts.push({est,torre:(r[2]||"").trim(),pata,zona:(r[4]||"").trim(),tf:(r[5]||"").trim()});
    const a={};for(const [c,aid] of Object.entries(COLS_C)){const v=pv(r[+c]);if(v>0)a[aid]=v;}
    vals.set(kP("cruce",est,pata),{meta:{sector:"cruce",unidad:est,pata,kind:"pata"},acts:a});
    chk.n++;if(Math.abs(gPct((k,x)=>a[x]||0,"","cr")-pv(r[18]))>0.6)chk.bad.push(est+"-"+pata);}
  return {patas:pts,vals,chk};
}
async function decodeBuf(buf){try{return new TextDecoder("utf-8",{fatal:true}).decode(buf);}catch(e){return new TextDecoder("windows-1252").decode(buf);}}
function managedFor(meta){if(meta.kind==="pata")return actsG("cr").map(a=>a.id);const gs=meta.sector==="cruce"?["pre","mon"]:["pre","amet","ahor","zv","pila","mon"];return acts().filter(a=>gs.includes(a.g)).map(a=>a.id);}
/* ¿El valor vigente de esta actividad viene de una importación de Excel? (las cargas antiguas no marcaban "imp" en act, pero su historial sí) */
function vigenteImportado(d,a){const x=d&&d.act&&d.act[a];if(!x)return true;return !!(x.imp||(d.hist&&d.hist["i"+x.ts+"_"+a]&&d.hist["i"+x.ts+"_"+a].imp));}
/* No reemplazar lo registrado en terreno (en la app) con fecha igual o posterior al corte del Excel */
function protegido(d,a,fecha){const x=d&&d.act&&d.act[a];return !!(x&&!vigenteImportado(d,a)&&(x.fecha||"")>=fecha);}
async function writeOp(op,fecha,ts){
  const act={},hist={};
  for(const [a,v] of Object.entries(op.ch)){hist["i"+ts+"_"+a]={a,pct:v,fecha,por:S.me,pn:S.userName,obs:"Carga desde matriz Excel",ts,imp:true};act[a]={pct:v,fecha,por:S.me,pn:S.userName,ts,imp:true};}
  const base=baseOf(op.x.meta.sector,op.x.meta);
  await rpcAvance(op.k,base,act,hist);mergeLocal(op.k,base,act,hist);
}
async function importar(genTxt,cruTxt,fecha){
  if(S.imp&&S.imp.running)return;
  S.imp={running:true,title:"Cargando matrices Excel…",done:0,total:0,msg:"Leyendo matrices"};render();
  try{
    const G=parseGeneral(genTxt);const C=cruTxt?parseCruce(cruTxt):{patas:(S.uni&&S.uni.patas)||[],vals:new Map(),chk:{n:0,bad:[]}};
    const torreCr={};for(const p of C.patas)if(!torreCr[p.est])torreCr[p.est]=p.torre;
    const uni={v:2,estructuras:G.est.map(e=>e.sec==="cruce"&&torreCr[e.id]?Object.assign({},e,{torre:torreCr[e.id]}):e),patas:C.patas,ts:Date.now()};
    S.imp.msg="Guardando la lista de estructuras";render();
    await withRetry(()=>setConfig("unidades",uni));
    const vals=new Map([...G.vals,...C.vals]);const ts=Date.now();const ops=[];let prot=0;
    for(const [k,x] of vals){const d=S.av.get(k);const ch={};
      for(const a of managedFor(x.meta)){const v=x.acts[a]||0;const c=d&&d.act&&d.act[a]?num(d.act[a].pct,0):0;if(Math.abs(c-v)>0.01){if(protegido(d,a,fecha)){prot++;continue;}ch[a]=v;}}
      if(Object.keys(ch).length)ops.push({k,d,x,ch});}
    S.imp.total=ops.length;S.imp.msg="Guardando avances";render();
    let i=0;const worker=async()=>{while(i<ops.length){const op=ops[i++];await withRetry(()=>writeOp(op,fecha,ts));S.imp.done++;schedule();}};
    await Promise.all([worker(),worker(),worker()]);
    await withRetry(()=>updateConfig("proyecto",{importPendiente:false,importado:{fecha,ts,cambios:ops.length,estructuras:uni.estructuras.length,patas:uni.patas.length}}));
    const bad=G.chk.bad.concat(C.chk.bad);
    S.imp={running:false,ok:true,msg:`Carga completa con fecha ${fmtD(fecha)}: ${uni.estructuras.length} estructuras y ${uni.patas.length} patas; ${ops.length} con cambios.${prot?` Se respetaron ${prot} avance(s) registrados en terreno con fecha igual o posterior al corte.`:""}`,
      chk:bad.length?`Verificación: ${bad.length} fila(s) no cuadran con los totales del Excel (${bad.slice(0,8).join(", ")}${bad.length>8?"…":""}).`:`Verificación: los totales de las ${G.chk.n+C.chk.n} filas cuadran con el Excel.`};
  }catch(e){S.imp={running:false,ok:false,msg:e.code==="denied"?"No tienes permiso de administrador.":((e&&e.message)||"Error")};}
  render();
}

async function guardarSE(){

  catch(e){toast(e.code==="denied"?"No tienes permiso de administrador.":"No se pudo guardar.",true);}

function seRowVals(cat,r){const a={};for(const x of SE_ACTS[cat]){const v=pv(r[x.col]);if(v>0)a[x.id]=v;}return a;}
function parseSEFund(txt){
  const rows=splitRows(txt);let mode=null;const out=[];const chk={n:0,bad:[]};
  for(const r of rows){const c1=(r[1]||"").trim();const C=c1.toUpperCase();
    if(C==="CANALETAS"){mode="can";continue;}if(C==="DRENAJES"){mode="dre";continue;}
    if(C==="FUNDACIONES"&&mode){mode="end";continue;}
    if(!mode&&/^item$/i.test(c1)&&/^id$/i.test((r[3]||"").trim())&&/replanteo/i.test(r[9]||"")){mode="fun";continue;}
    if(!mode||mode==="end"||!/^\d+$/.test(c1))continue;
    const it=SE_ITEMS.find(x=>x.cat===mode&&x.n===+c1);if(!it)continue;
    const a=seRowVals(mode,r);out.push({it,a});
    const W=SE_ACTS[mode].reduce((x,y)=>x+y.peso,0);const t=SE_ACTS[mode].reduce((x,y)=>x+y.peso*(a[y.id]||0),0)/W;chk.n++;
    const tc=(r[SE_TOTCOL[mode]]||"").trim();if(tc&&Math.abs(t-pv(tc))>0.6)chk.bad.push(it.id);}
  if(!out.some(x=>x.it.cat==="fun"))throw new Error("La matriz de fundaciones de la S/E no tiene el formato esperado (falta la fila de encabezado 'Item / ID / Replanteo').");
  return {out,chk};
}
function parseSEEst(txt){
  const rows=splitRows(txt);let mode=null;const out=[];const chk={n:0,bad:[]};
  for(const r of rows){const c1=(r[1]||"").trim();
    if(!mode&&/^item$/i.test(c1)&&/pre-?armado/i.test(r[9]||"")){mode="est";continue;}
    if(mode&&/^estructuras$/i.test(c1))break;
    if(!mode||!/^\d+$/.test(c1))continue;
    const it=SE_ITEMS.find(x=>x.cat==="est"&&x.n===+c1);if(!it)continue;
    const a=seRowVals("est",r);out.push({it,a});
    const t=SE_ACTS.est.reduce((x,y)=>x+y.peso*(a[y.id]||0),0)/100;chk.n++;
    const tc=(r[SE_TOTCOL.est]||"").trim();if(tc&&Math.abs(t-pv(tc))>0.6)chk.bad.push(it.id);}
  if(!out.length)throw new Error("La matriz de estructuras de la S/E no tiene el formato esperado (falta la fila 'Item / Pre-Armado').");
  return {out,chk};
}

  }catch(e){S.imp={running:false,ok:false,msg:e.code==="denied"?"No tienes permiso de administrador.":((e&&e.message)||"Error")};}

  L.push("");L.push("SUBESTACIÓN TINEO · Contratista "+SE_CONTRATISTA+" · Avance global "+f(S.SE.total)+"%");L.push("Partida;N°;ID;Descripción;Grupo;Tipo;Avance %;Estado");
  for(const c of SE_CATS)for(const it of seItems(c.id)){const p=seP(it);L.push([c.nombre,it.n,it.id,it.desc,SE_GRP[it.grp]||"",it.tipo,f(p),EST_TXT[seEst(p)]].map(q).join(";"));}
  L.push("");L.push("REGISTROS EN TERRENO");L.push("Fecha;Sector;Unidad;Actividad;Avance %;Inspector;Observación");
  for(const h of hist.slice().reverse()){const a=actById(h.a),s=secById(h.sec);L.push([fmtD(h.fecha),s?s.nombre:h.sec,h.lab,a?a.nombre:h.a,f(num(h.pct,0)),h.pn||"",h.obs||""].map(q).join(";"));}
  descargar("avance-tineo-ancud-"+today()+".csv","﻿"+L.join("\r\n"),"text/csv;charset=utf-8");toast("Archivo descargado.");
}

/* ---------- tooltip ---------- */
const tipEl=()=>$("#gtip");
document.addEventListener("pointerover",ev=>{if(ev.pointerType==="touch")return;const t=ev.target.closest&&ev.target.closest("[data-tip]");const g=tipEl();if(!t){g.style.display="none";return;}g.textContent=t.getAttribute("data-tip");g.style.display="block";});
document.addEventListener("pointermove",ev=>{const g=tipEl();if(g.style.display!=="block")return;const w=g.offsetWidth,h=g.offsetHeight;let x=ev.clientX+14,y=ev.clientY+16;if(x+w>innerWidth-8)x=ev.clientX-w-12;if(y+h>innerHeight-8)y=ev.clientY-h-12;g.style.left=x+"px";g.style.top=y+"px";});
document.addEventListener("pointerout",ev=>{if(!ev.relatedTarget||!ev.relatedTarget.closest||!ev.relatedTarget.closest("[data-tip]"))tipEl().style.display="none";});
document.addEventListener("scroll",()=>{tipEl().style.display="none";},true);

/* ---------- eventos ---------- */
function go(tab){S.tab=tab;tipEl().style.display="none";try{history.replaceState(null,"","#"+tab);}catch(e){}render();window.scrollTo({top:0});}
function keepSel(){const ok=new Set(unitsFor(S.reg,true).map(u=>u.uid));S.reg.sel=new Set([...S.reg.sel].filter(u=>ok.has(u)));}
/* Elementos de los dibujos (torres, patas, cotas) accionables con Enter / espacio */

document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&S.drw){if(S.drw.edit){S.drw.edit=null;render();}else closeDrawer();}});
document.addEventListener("submit",ev=>{ev.preventDefault();if(ev.target.id==="f-login")doLogin();else if(ev.target.id==="f-pass")doSetPass();});
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button,[data-close],[data-ose],[data-open],[data-dashet]");if(!b)return;const ds=b.dataset;const r=S.reg;
  if(ds.close){closeDrawer();return;}
  if(ds.forgot){doForgot();return;}
  if(ds.logout){sb&&sb.auth.signOut();return;}
  if(ds.chpass){S.state="setpass";S.authMode="change";S.authErr="";render();return;}
  if(ds.cancelpass){S.authMode=null;S.state="ok";render();return;}
  if(ds.reload){location.reload();return;}
  if(ds.tab){go(ds.tab);return;}
  /* liberaciones */
  if(ds.libopen){openLib(ds.libopen);return;}
  if(ds.libed){const D=S.drw;if(!D||!D.lib)return;if(D.ed===ds.libed){D.ed=null;D.f=null;}else{const x=libAct(D.key,ds.libed),e=libEst(D.key,ds.libed);D.ed=ds.libed;D.f={est:e==="pend"?"tram":e==="tram"?"lib":e,fecha:today(),ref:(x&&x.ref)||"",obs:"",cod:ds.libed==="pmf"||ds.libed==="pmfcod"?libCod(D.key):""};}render();return;}
  if(ds.pmfed){const c=ds.pmfed,src=ds.pmfsrc||"bar";if(S.pmfEd&&S.pmfEd.code===c&&S.pmfEd.src===src)S.pmfEd=null;else{const x=pmfAct(c),e=pmfEst(c);S.pmfEd={code:c,src,est:e==="pend"?"tram":e==="tram"?"lib":e==="na"?"lib":e,fecha:today(),ref:(x&&x.ref)||"",obs:""};}render();return;}
  if(ds.pmfest){if(S.pmfEd){S.pmfEd.est=ds.pmfest;render();}return;}
  if(b.id==="pmf-save"){pmfSave();return;}
  if(b.id==="lib-cod-save"){libSaveCod();return;}
  if(ds.libest){if(S.drw&&S.drw.f){S.drw.f.est=ds.libest;render();}return;}
  if(b.id==="lib-save"){libSaveVar();return;}
  if(b.id==="lib-nota-save"){libSaveNota();return;}
  if(b.id==="lib-b-apply"){libBulkApply();return;}
  if(ds.libtipo){S.lib.tipo=ds.libtipo;render();return;}
  if(ds.libclear){Object.assign(S.lib,{tipo:"todo",sec:"total",tt:"",est:"",pmf:"",q:""});if(S.pmfEd&&S.pmfEd.src==="bar")S.pmfEd=null;render();return;}
  if(ds.libselclear){S.lib.sel=new Set();render();return;}
  if(ds.libck){const k=ds.libck;if(S.lib.sel.has(k))S.lib.sel.delete(k);else S.lib.sel.add(k);render();return;}
  if(ds.libckall){const ks=libUnits().filter(u=>libMatch(u)).map(u=>u.key);const todos=ks.length&&ks.every(k=>S.lib.sel.has(k));ks.forEach(k=>todos?S.lib.sel.delete(k):S.lib.sel.add(k));render();return;}
  if(ds.libloc){libLocate(ds.libloc);return;}
  if(ds.libbase){S.lib.base=ds.libbase;libSetBase(ds.libbase);render();return;}
  if(ds.libfit){libFit();return;}
  if(ds.libkml){descargarKML();return;}
  if(ds.libcsv){descargarLibCSV();return;}
  if(ds.open){const [s,id]=ds.open.split("|");tipEl().style.display="none";openDrawer(s,id,ds.pata);return;}
  if(ds.ose){const i=ds.ose.indexOf("|");tipEl().style.display="none";openDrawerSE(ds.ose.slice(0,i),ds.ose.slice(i+1));return;}
  if(ds.secat){S.seCat=ds.secat;render();return;}
  if(b.id==="se-save"){guardarSE();return;}
  if(b.id==="se-imp"){importarArchivosSE();return;}
  if(ds.dash){S.dash=ds.dash;render();return;}
  if(ds.dashet){S.dashEt=S.dashEt===ds.dashet?null:ds.dashet;render();return;}
  if(ds.kpi){Object.assign(S.map,{sec:S.dash,contr:S.dashF.contr,tt:"",q:""});go("linea");return;}
  if(ds.kclear){S.dashF={contr:"",tt:""};S.dash="total";render();return;}
  if(ds.vista){S.map.vista=ds.vista;render();return;}
  if(ds.mclear){Object.assign(S.map,{sec:"total",tt:"",contr:"",q:""});render();return;}
  if(ds.tsec){S.tbl={sec:ds.tsec,q:"",tt:"",est:""};render();return;}
  if(ds.dpata){S.drw.pata=ds.dpata;S.drw.edit=null;render();return;}
  if(ds.dfg){S.drw.fgSel=ds.dfg;S.drw.edit=null;render();return;}
  if(ds.qe){if(!S.canWrite)return;const [key,aid]=ds.qe.split("|");const D=S.drw;if(D.edit&&D.edit.key===key&&D.edit.aid===aid){D.edit=null;}else{const c=cur(key,aid);const ac=actById(aid);D.edit={key,aid,pct:(ac&&ac.circ)||c>=100?100:Math.min(100,[25,50,75,100].find(x=>x>c)||100),fecha:today(),obs:""};}render();return;}
  if(ds.qp){S.drw.edit.pct=+ds.qp;render();return;}
  if(b.id==="q-save"){quickSave();return;}
  if(b.id==="q-cancel"){S.drw.edit=null;render();return;}
  if(ds.csv){descargarCSV();return;}
  if(ds.rsec){if(r.sec!==ds.rsec)S.reg=Object.assign(newReg(),{sec:ds.rsec});render();return;}
  if(ds.retapa){r.etapa=ds.retapa;r.grp=grpFor(ds.retapa,r.sec);r.act=null;keepSel();render();return;}
  if(ds.rgrp){r.grp=ds.rgrp;r.act=null;keepSel();render();return;}
  if(ds.ract){r.act=ds.ract;keepSel();render();return;}
  if(ds.ru){r.sel.has(ds.ru)?r.sel.delete(ds.ru):r.sel.add(ds.ru);render();return;}
  if(ds.rsel){const ids=regAids(r);r.sel=new Set(ds.rsel==="pend"?[...r.sel].concat(unitsFor(r,false).filter(u=>ids.some(a=>cur(u.key,a)<100)).map(u=>u.uid)):[]);render();return;}
  if(ds.rfase){r.fases.has(ds.rfase)?r.fases.delete(ds.rfase):r.fases.add(ds.rfase);render();return;}
  if(ds.rcirc){const ids=condActs().filter(a=>a.circ===ds.rcirc).map(a=>a.id);const all=ids.every(i=>r.fases.has(i));ids.forEach(i=>all?r.fases.delete(i):r.fases.add(i));render();return;}
  if(ds.rfall){r.fases=new Set(condActs().map(a=>a.id));render();return;}
  if(ds.rfnone){r.fases=new Set();render();return;}
  if(ds.rpct){r.pct=+ds.rpct;render();return;}
  if(ds.rreset){S.reg=newReg();render();return;}
  if(b.id==="r-save"){guardar();return;}
  if(b.id==="i-run"){importarArchivos();return;}
  if(b.id==="b-imp"){importarRespaldo();return;}
  if(b.id==="b-exp"){exportarRespaldo();return;}
  if(b.id==="c-save"){guardarConfig();return;}
  if(b.id==="c-discard"){S.draft=null;render();return;}
});
document.addEventListener("input",ev=>{
  const t=ev.target,ds=t.dataset;
  if(t.id==="lib-q"){S.lib.q=t.value;clearTimeout(mqT);mqT=setTimeout(()=>{if(ptrDown){pendingRender=true;return;}render();},250);return;}
  if(S.drw&&S.drw.lib){const f=S.drw.f;if(f&&t.id==="lib-fecha"){f.fecha=t.value;return;}if(f&&t.id==="lib-ref"){f.ref=t.value;return;}if(f&&t.id==="lib-obs"){f.obs=t.value;return;}if(f&&t.id==="lib-cod"){f.cod=t.value;return;}if(t.id==="lib-nota"){S.drw.nota=t.value;return;}}
  if(S.pmfEd){if(t.id==="pmf-fecha"){S.pmfEd.fecha=t.value;return;}if(t.id==="pmf-ref"){S.pmfEd.ref=t.value;return;}if(t.id==="pmf-obs"){S.pmfEd.obs=t.value;return;}}
  if(t.id==="lib-b-ref"){S.lib.bulk.ref=t.value;return;}if(t.id==="lib-b-obs"){S.lib.bulk.obs=t.value;return;}if(t.id==="lib-b-fecha"){S.lib.bulk.fecha=t.value;return;}
  if(t.id==="q-pct"){const v=num(t.value,NaN);if(isFinite(v)&&S.drw&&S.drw.edit)S.drw.edit.pct=pctIn(v);return;}
  if(t.id==="q-fecha"){if(S.drw&&S.drw.edit)S.drw.edit.fecha=t.value;return;}
  if(t.id==="q-obs"){if(S.drw&&S.drw.edit)S.drw.edit.obs=t.value;return;}
  if(t.id==="r-obs"){S.reg.obs=t.value;return;}
  if(t.id==="r-fecha"){S.reg.fecha=t.value;return;}
  if(t.id==="r-pct"){const v=num(t.value,NaN);if(isFinite(v))S.reg.pct=pctIn(v);return;}
  if(t.id==="r-q"){S.reg.q=t.value;render();return;}
  /* el pictograma en detalle es pesado: se redibuja cuando se deja de escribir */
  if(t.id==="m-q"){S.map.q=t.value;clearTimeout(mqT);mqT=setTimeout(()=>{if(ptrDown){pendingRender=true;return;}render();},250);return;}
  if(t.id==="t-q"){S.tbl.q=t.value;render();return;}
  if(!S.draft)return;
  if(ds.cf)S.draft[ds.cf]=t.value;
  else if(ds.sp)S.draft.sectores[+ds.sp].peso=num(t.value,0);
  else if(ds.pse)S.draft.pesoSE=num(t.value,0);
  else if(ds.ep)S.draft.etapas[+ds.ep].peso=num(t.value,0);
  else if(ds.tsp){const e=S.draft.etapas.find(x=>x.id==="ten");if(e)e[ds.tsp]=num(t.value,0);}
  else if(ds.an)S.draft.actividades[+ds.an].nombre=t.value;
  else if(ds.ap)S.draft.actividades[+ds.ap].peso=num(t.value,0);
  else if(ds.vn)S.draft.vanos[ds.vn]=t.value;
});
document.addEventListener("input",ev=>{const t=ev.target;if(t.dataset&&t.dataset.sep){if(!S.seDraft)S.seDraft=sePesos();S.seDraft[t.dataset.sep]=num(t.value,0);}});

document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"&&S.state==="ok"&&Date.now()-S.lastLoad>120000){try{await conSesion(loadAll);render();}catch(e){}}});

/* ---------- inicio ---------- */
async function handleSession(session,force){
  const uid=session&&session.user?session.user.id:null;
  /* al abrir, getSession y el evento inicial llaman a esta función casi a la vez: si ya se está cargando el mismo usuario, no se repite */
  if(!force&&uid===S.me&&(S.state==="ok"||S.state==="setpass"||S.state==="loading"))return;
  S.me=uid;S.authErr="";
  if(!uid){if(S.chan){sb.removeChannel(S.chan);S.chan=null;}S.cfg=null;S.uni=null;S.av=new Map();S.canWrite=false;S.canAdmin=false;S.drw=null;S.state="login";render();return;}
  const u=session.user;S.userEmail=u.email||"";S.userName=(u.user_metadata&&(u.user_metadata.nombre||u.user_metadata.full_name||u.user_metadata.name))||S.userEmail;
  if(S.authMode==="setpass"){S.state="setpass";render();return;}
  S.state="loading";render();
  try{
    await conSesion(async()=>{const {data:adm,error}=await sb.from("admins").select("user_id").eq("user_id",uid).maybeSingle();if(error)throw mapErr(error);S.canAdmin=!!adm;});S.canWrite=true;
    await conSesion(loadAll);subscribe();S.state="ok";S.authMsg="";
    const h0=(location.hash||"").slice(1);if(TABS.some(t=>t.id===h0))S.tab=h0;
    if(S.tab==="config"&&!S.canAdmin)S.tab="resumen";
  }catch(e){
    /* la sesión no se pudo renovar: se vuelve al ingreso con un aviso claro, en vez del error técnico */
    if(e&&e.code==="auth"){S.authMsg="Tu sesión expiró. Vuelve a ingresar con tu correo y contraseña.";S.me=null;S.state="login";try{await sb.auth.signOut({scope:"local"});}catch(_){}render();return;}
    S.state="error";S.authErr=e&&e.code==="unavailable"?"Sin conexión con el servidor. Revisa tu internet y presiona «Reintentar».":e&&e.code==="denied"?"Tu usuario no tiene permiso para ver los datos. Contacta al administrador.":"El servidor respondió: "+((e&&e.message)||"error desconocido");}
  render();
}
render();
(async function boot(){
  if(!window.supabase||!APP.SUPABASE_URL||/TU-PROYECTO/.test(APP.SUPABASE_URL)||!APP.SUPABASE_ANON_KEY||/PEGA-AQUI/.test(APP.SUPABASE_ANON_KEY)){S.state="noconfig";render();return;}
  sb=window.supabase.createClient(APP.SUPABASE_URL,APP.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==="PASSWORD_RECOVERY")S.authMode="setpass";setTimeout(()=>handleSession(session,ev==="PASSWORD_RECOVERY"),0);});
  const {data:{session}}=await sb.auth.getSession();await handleSession(session);
})();
})();
