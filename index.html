<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Avance Tineo–Ancud</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 26'%3E%3Cpath d='M11 1 L15.5 8 L21 8 L21 10.5 L15.5 10.5 L17.5 25 L4.5 25 L6.5 10.5 L1 10.5 L1 8 L6.5 8 Z' fill='%231c5cab'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f5f7f8; --surface-3:#e3e8eb;
  --ink:#14212b; --ink-2:#44525d; --muted:#76838d; --line:#d9dfe3; --line-2:#bfc9d0;
  --accent:#1f5fbf; --accent-soft:#e3ecf9; --on-accent:#ffffff;
  --c-continente:#2a78d6; --c-cruce:#eb6834; --c-isla:#1baf7a;
  --i-per:#eda100; --i-acc:#e87ba4; --i-fun:#008300; --i-mon:#4a3aa7;
  --seq-hi:#1c5cab; --on-seq:#ffffff; --vano-hi:#c9501d; --water:#d7e6f5;
  --good:#0ca30c; --good-ink:#006300; --eje:#3987e5; --warn:#fab219; --warn-ink:#8a5a00; --crit-ink:#b02a2a;
  --c-se:#4a3aa7; --fill-ok:#bfe6bf;
  --shadow:0 1px 2px rgba(20,33,43,.06),0 4px 16px rgba(20,33,43,.05);
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0e1316; --surface:#161e24; --surface-2:#1c262d; --surface-3:#26323b;
    --ink:#ecf1f4; --ink-2:#b4c0c8; --muted:#86939c; --line:#26323b; --line-2:#394752;
    --accent:#5b9cf0; --accent-soft:#1b2e47; --on-accent:#0e1316;
    --c-continente:#3987e5; --c-cruce:#d95926; --c-isla:#199e70;
    --i-per:#c98500; --i-acc:#d55181; --i-fun:#0ca30c; --i-mon:#9085e9;
    --seq-hi:#86b6ef; --on-seq:#0e1316; --vano-hi:#f08a5d; --water:#16283a;
    --good:#0ca30c; --good-ink:#2fc22f; --eje:#5b9cf0; --warn-ink:#fab219; --crit-ink:#f07474;
    --c-se:#9085e9; --fill-ok:#1f4d24;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:0 48px}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-disp);text-wrap:balance;margin:0;letter-spacing:.005em}
h2{font-size:1.25rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-disp);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.84rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.rotulo{display:grid;grid-template-columns:1fr auto;border:1.5px solid var(--ink);background:var(--surface);margin-top:16px}
.rotulo .main{padding:14px 18px;border-right:1.5px solid var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.rotulo .code{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2);letter-spacing:.04em}
.rotulo h1{font-size:clamp(1.35rem,3.2vw,2rem);font-weight:700;line-height:1.1}
.rotulo .sub{color:var(--ink-2);font-size:.9rem}
.rotulo .cells{display:grid;grid-template-columns:repeat(3,minmax(100px,auto))}
.rotulo .cell{padding:10px 14px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;justify-content:center;gap:2px}
.rotulo .cell:first-child{border-left:0}
.rotulo .cell b{font-family:var(--f-mono);font-weight:600;font-size:1.05rem}
.rotulo.solo{grid-template-columns:1fr}.rotulo.solo .main{border-right:0}
@media (max-width:760px){.rotulo{grid-template-columns:1fr}.rotulo .main{border-right:0;border-bottom:1.5px solid var(--ink)}.rotulo.solo .main{border-bottom:0}.rotulo .cells{grid-template-columns:repeat(3,1fr)}.rotulo .cell{padding:8px 10px}}

nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;padding-block:10px;overflow-x:auto;scrollbar-width:none;align-items:center}
nav.tabs button{border:1px solid var(--line-2);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.userbox{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:.8rem;white-space:nowrap;color:var(--ink-2);padding-left:10px}
.userbox button{border:1px solid var(--line-2);background:var(--surface);padding:6px 10px;border-radius:999px;font-size:.8rem}
.role{font-family:var(--f-disp);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;border:1px solid currentColor;border-radius:999px;padding:1px 8px}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px dashed var(--warn);background:color-mix(in oklab,var(--warn) 10%,var(--surface));padding:10px 14px;margin-bottom:14px;font-size:.9rem}
.banner b{font-family:var(--f-disp)}
.note{border:1px solid var(--line);background:var(--surface-2);padding:10px 14px;font-size:.9rem;color:var(--ink-2)}
.progress{height:8px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:var(--w)}

.panel{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

.auth{max-width:420px;margin:28px auto 0;display:flex;flex-direction:column;gap:14px}
.auth .panel{display:flex;flex-direction:column;gap:14px}
.auth .err{color:var(--crit-ink);font-size:.88rem}
.linklike{all:unset;cursor:pointer;color:var(--accent);font-size:.88rem;text-decoration:underline;text-underline-offset:3px}

.ringbox{position:relative;display:inline-grid;place-items:center;flex:none}
.ringbox svg{display:block}
.ringbox .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ringbox .rv b{font-family:var(--f-disp);font-weight:700}
.ringbox .rv span{font-size:.68rem;color:var(--muted);font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.06em}

.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.hero .htxt{display:flex;flex-direction:column;gap:8px}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini{border:1.5px solid var(--line);background:var(--surface);padding:10px;display:flex;gap:12px;align-items:center;text-align:left;border-radius:6px}
.mini:hover{border-color:var(--ink-2)}
.mini[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.mini .mt{display:flex;flex-direction:column;gap:2px;min-width:0}
.mini .mt b{font-family:var(--f-disp);font-size:1.05rem}
.mini .mt span{font-size:.78rem;color:var(--ink-2)}
@media (max-width:860px){.hero{grid-template-columns:1fr;justify-items:center}.hero .htxt{width:100%}.minis{grid-template-columns:1fr}}

.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;flex-wrap:wrap;max-width:100%}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:.85rem;border-left:1px solid var(--line-2);display:inline-flex;align-items:center;gap:6px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dot{width:10px;height:10px;border-radius:2px;background:var(--c);flex:none;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:500;color:var(--ink-2)}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--ink-2);flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}

.hbars{display:flex;flex-direction:column;gap:12px}
.hb{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px;align-items:center}
.hb .hl{font-size:.88rem;display:flex;flex-direction:column;line-height:1.2}
.hb .hl small{color:var(--muted);font-size:.74rem}
.hb .tracks{display:flex;flex-direction:column;gap:3px}
.trk{display:grid;grid-template-columns:1fr 50px;gap:8px;align-items:center}
.trk .tb{height:12px;background:var(--surface-3);border-radius:2px;position:relative;overflow:hidden}
.trk .tb i{position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--c,var(--accent));border-radius:2px}
.trk .tv{font-family:var(--f-mono);font-size:.78rem;text-align:right}
.trk.big .tb{height:18px}
button.hb{all:unset;display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px;align-items:center;cursor:pointer;padding:4px;border-radius:4px}
button.hb:hover{background:var(--surface-2)}
button.hb:focus-visible{outline:2px solid var(--accent)}
.drill{margin:-4px 0 4px 16px;padding:8px 12px;border-left:2px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
.drill .trk{grid-template-columns:minmax(140px,240px) 1fr 50px}
.drill .trk span{font-size:.8rem;color:var(--ink-2)}

.stk{display:flex;height:22px;border-radius:3px;overflow:hidden;background:var(--surface-3)}
.stk i{display:grid;place-items:center;font-style:normal;font-size:.72rem;font-family:var(--f-mono);font-weight:600;min-width:0;overflow:hidden;white-space:nowrap}
.stk .ter{background:var(--good);color:#fff}
.stk .eje{background:var(--eje);color:var(--on-accent)}
.stk .sin{background:var(--surface-3);color:var(--ink-2)}
.stkrow{display:grid;grid-template-columns:110px 1fr 48px;gap:10px;align-items:center;font-size:.86rem}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kpic{border:1.5px solid var(--line);background:var(--surface);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.kpic:hover{border-color:var(--ink-2)}
.kpic .kh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kpic .kv{display:flex;align-items:baseline;gap:4px;line-height:1}
.kpic .kv b{font-family:var(--f-disp);font-size:2.2rem;font-weight:700}
.kpic .kv .of{font-family:var(--f-disp);font-size:1.1rem;color:var(--muted)}
.kpic .kp{font-family:var(--f-mono);font-weight:600;font-size:.9rem}
.kpic .kp.ok{color:var(--good-ink)}
.kpic .kl{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:4px 8px;font-size:.78rem;color:var(--ink-2)}
.kpic .kl span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.kpic .kl b{font-family:var(--f-mono)}
.kpic .ks{font-size:.76rem;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block;background:var(--c)}
.sw.o{background:transparent;border:1.5px solid var(--line-2)}

.cols{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:18px;border-bottom:1px solid var(--line-2)}
.col{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;border:0;background:none;padding:0}
.col .cb{width:70%;max-width:34px;background:var(--seq-hi);border-radius:3px 3px 0 0;height:var(--h);min-height:2px}
.col:hover .cb,.col[aria-pressed="true"] .cb{background:var(--accent);outline:2px solid var(--accent)}
.col .cv{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-2)}
.colx{display:flex;gap:6px}
.colx span{flex:1 0 34px;text-align:center;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}

.feed{display:flex;flex-direction:column}
.feed .it{display:grid;grid-template-columns:86px 1fr auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.feed .it:last-child{border-bottom:0}
.feed .d{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2)}
.feed .w{font-size:.88rem;min-width:0}
.feed .w .o{color:var(--ink-2);font-size:.82rem;margin-top:2px}
.feed .p{font-family:var(--f-mono);font-weight:600}
.linkbtn{all:unset;cursor:pointer;font-family:var(--f-mono);font-weight:600;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.linkbtn:hover{text-decoration-color:var(--ink)}
.linkbtn:focus-visible{outline:2px solid var(--accent)}

.mapbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.grad{display:inline-block;width:110px;height:10px;border-radius:2px;background:linear-gradient(90deg,var(--surface-3),var(--c))}
.line{display:flex;flex-wrap:wrap;row-gap:6px;padding:4px 0}
.tw{position:relative;width:44px;height:60px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;border-radius:4px}
.tw.pic{height:70px}
.tw:hover{background:var(--surface-2)}
.tw.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.tw.dim{opacity:.22}
.tw .vl,.tw .vr{position:absolute;top:14px;height:3px;width:50%;background:var(--line-2)}
.tw .vl{left:0}.tw .vr{right:0}
.tw .vl.v,.tw .vr.v{height:4px;top:13.5px;background:color-mix(in oklab,var(--vano-hi) var(--v),var(--line-2))}
.tw .vl.v0,.tw .vr.v0{background:repeating-linear-gradient(90deg,var(--line-2) 0 3px,transparent 3px 6px)}
.tw .vl.none,.tw .vr.none{background:transparent}
.tw svg{position:relative;z-index:1;margin-top:2px}
.tw .n{font-family:var(--f-mono);font-size:.66rem;font-weight:600;margin-top:1px;line-height:1.1}
.tw .mk{display:grid;grid-template-columns:repeat(4,7px);gap:1px;margin-top:2px}
.tw .mk i{height:7px;border:1px solid var(--line-2);border-radius:1px}
.tw .mk i.part{border-color:var(--c);background:color-mix(in oklab,var(--c) 30%,transparent)}
.tw .mk i.full{border-color:var(--c);background:var(--c)}
.ttmark{width:100%;display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.ttmark::after{content:"";flex:1;border-top:1px dashed var(--line-2)}
.canalseg{position:relative;width:132px;height:60px;display:flex;align-items:flex-end;justify-content:center;background:var(--water);border-radius:6px;font-family:var(--f-disp);font-size:.66rem;letter-spacing:.14em;color:var(--accent);padding-bottom:6px;font-weight:600}
.canalseg .vl{position:absolute;top:14px;left:0;right:0;height:4px}
.canalseg .vl.v{background:color-mix(in oklab,var(--vano-hi) var(--v),var(--line-2))}
.canalseg .vl.v0{background:repeating-linear-gradient(90deg,var(--ink-2) 0 3px,transparent 3px 6px)}
.picm{display:inline-grid;grid-template-columns:repeat(4,12px);gap:2px}
.picm i{height:9px;border-radius:1px;background:var(--c)}

.tbl-wrap{overflow:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--f-disp);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);background:var(--surface-2);position:sticky;top:0;z-index:1}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.heat{text-align:center;font-family:var(--f-mono);font-size:.8rem;background:color-mix(in oklab,var(--seq-hi) var(--p),var(--surface))!important;min-width:58px;border-left:2px solid var(--surface)}
td.heat.hi{color:var(--on-seq)}
td.heat.zero{color:var(--muted)}
td.heat small{font-size:.68rem;opacity:.8;margin-left:3px}
.est{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;white-space:nowrap}
.est::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.est.ter{color:var(--good-ink)} .est.ter::before{background:currentColor}
.est.eje{color:var(--accent)} .est.eje::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.est.sin{color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters .field{min-width:130px;flex:1}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.84rem;font-weight:500;color:var(--ink-2)}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=number],input[type=date],select,textarea{border:1.5px solid var(--line-2);background:var(--surface);padding:9px 10px;border-radius:4px;width:100%;min-width:0}
input[type=file]{font-size:.85rem;max-width:100%}
textarea{resize:vertical;min-height:64px}
textarea.code{font-family:var(--f-mono);font-size:.82rem;min-height:120px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.btn{border:1.5px solid var(--ink);background:var(--surface);padding:10px 16px;border-radius:4px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);padding:12px 20px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 10px;font-size:.84rem;font-weight:500;border-width:1px}
.btn.ghost{border-color:var(--line-2)}
.warnline{color:var(--warn-ink);font-size:.86rem}
.summary{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;font-size:.95rem}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1.5px solid var(--line-2);background:var(--surface);padding:9px 0;width:58px;font-family:var(--f-mono);font-weight:600;border-radius:4px}
.quick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.steps{display:flex;flex-direction:column;gap:14px}
.step{background:var(--surface);border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.step.off{opacity:.55}
.step-h{display:flex;align-items:center;gap:12px}
.step-n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem;flex:none}
.step.done .step-n{background:var(--ink);color:var(--bg)}
.step-h .hint{font-size:.85rem;color:var(--ink-2)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opt{border:1.5px solid var(--line-2);background:var(--surface);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;border-radius:4px}
.opt:hover{border-color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .t{font-weight:600;display:flex;align-items:center;gap:8px}
.opt .s{font-size:.8rem;color:var(--ink-2)}
.grp{display:flex;flex-direction:column;gap:6px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;max-height:420px;overflow:auto;padding:2px}

function mergeLocal(key,base,act,hist){const prev=S.av.get(key);const d=Object.assign({},prev||base);d.act=Object.assign({},(prev&&prev.act)||{});d.hist=Object.assign({},(prev&&prev.hist)||{},hist);
  for(const [k,v] of Object.entries(act)){const p=d.act[k];if(!p||(p.fecha||"")<=(v.fecha||""))d.act[k]=v;}const m=new Map(S.av);m.set(key,d);S.av=m;}
async function setConfig(id,data){const {error}=await sb.from("config").upsert({id,data,updated_at:new Date().toISOString()});if(error)throw mapErr(error);if(id==="proyecto")S.cfg=normCfg(data);else if(id==="unidades")S.uni=normUni(data);else if(id==="se")S.se=data;}

/* ---------- modelo ---------- */
const cfgOk=()=>!!(S.cfg&&S.cfg.v===2);
function secs(){const c=S.cfg;return SECTORES_BASE.map(b=>{const x=((c&&c.sectores)||[]).find(s=>s.id===b.id)||{};return {id:b.id,nombre:x.nombre||b.nombre,peso:num(x.peso,1),desc:x.desc||""};});}
const secById=id=>secs().find(s=>s.id===id);
const acts=()=>((S.cfg&&S.cfg.actividades)||[]);
let GC={cfg:null,uni:null,m:{},v:{}};
function gc(){if(GC.cfg!==S.cfg||GC.uni!==S.uni)GC={cfg:S.cfg,uni:S.uni,m:{},v:{}};return GC;}
const actsG=g=>{const c=gc();return c.m[g]||(c.m[g]=acts().filter(a=>a.g===g));};
const actById=id=>acts().find(a=>a.id===id)||SE_ACT_BY_ID[id]||LEGACY[id];
const grpActs=g=>g&&g.indexOf("se_")===0?SE_ACTS[g.slice(3)]||[]:actsG(g);
const secName=id=>id==="se"?"Subestación Tineo":((secById(id)||{}).nombre||id);
/* --- Subestación: cálculo --- */
const kSE=(cat,id)=>"se__"+cat+"__"+safeId(id);
const PESO_SE_DEF=10;
const pesoSE=()=>num(S.cfg&&S.cfg.pesoSE,PESO_SE_DEF);
/* Participación real de un peso en el global (los pesos se normalizan aunque no sumen 100) */
function pesoShare(w){let W=pesoSE();for(const s of secs())if(estr(s.id).length)W+=s.peso;return W?w/W*100:0;}
function sePesos(){const p=(S.se&&S.se.pesos)||{};return Object.fromEntries(SE_CATS.map(c=>[c.id,num(p[c.id],SE_PESOS_DEF[c.id])]));}
function seItemPct(get,it){let W=0,P=0;for(const a of SE_ACTS[it.cat]){W+=a.peso;P+=a.peso*get(kSE(it.cat,it.id),a.id);}return W?P/W:0;}
function seCalc(get){const out={cat:{},grp:{},byI:{},total:0};let W=0,P=0;const pes=sePesos();
  for(const c of SE_CATS){const its=seItems(c.id);let s=0,done=0,eje=0;
    for(const it of its){const p=seItemPct(get,it);out.byI[it.cat+"|"+it.id]=p;s+=p;if(p>=99.95)done++;else if(p>0)eje++;
      const gk=c.id+"|"+it.grp;const g=out.grp[gk]||(out.grp[gk]={n:0,done:0,s:0});g.n++;g.s+=p;if(p>=99.95)g.done++;}
    const v=its.length?s/its.length:0;out.cat[c.id]={pct:v,n:its.length,done,eje,sin:its.length-done-eje};W+=pes[c.id];P+=pes[c.id]*v;}
  out.total=W?P/W:0;return out;}
const seP=it=>(S.SE&&S.SE.byI[it.cat+"|"+it.id])||0;
const seEst=p=>p>=99.95?"ter":p>0?"eje":"sin";
const grupos=()=>((S.cfg&&S.cfg.grupos)||[]);
const grupoById=id=>grupos().find(g=>g.id===id)||{id,nombre:id};
const etapas=()=>((S.cfg&&S.cfg.etapas)||[]);
const etapaById=id=>etapas().find(e=>e.id===id);
const pesoE=id=>{const x=etapaById(id);return x?num(x.peso,0):0;};
const allEst=()=>((S.uni&&S.uni.estructuras)||[]);
const estr=sec=>{const c=gc();const k="e_"+sec;return c.m[k]||(c.m[k]=allEst().filter(e=>e.sec===sec));};
const estById=(sec,id)=>estr(sec).find(e=>e.id===id);
const patas=id=>((S.uni&&S.uni.patas)||[]).filter(p=>p.est===id);
const safeId=s=>String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g,"_");
const kE=(s,id)=>s+"__"+safeId(id);
const kP=(s,id,p)=>kE(s,id)+"__"+safeId(p);
const kV=(s,a,b)=>s+"__V__"+safeId(a)+"__"+safeId(b);
const cur=(k,a)=>{const d=S.av.get(k);const x=d&&d.act&&d.act[a];return x?num(x.pct,0):0;};
function vanos(sec){const c=gc();if(c.v[sec])return c.v[sec];
  const ids=new Set(estr(sec).map(e=>e.id));const ov=S.cfg&&S.cfg.vanos&&S.cfg.vanos[sec];let list;
  if(ov&&ov.length)list=ov.filter(x=>x&&x.a&&x.b).map(x=>({a:x.a,b:x.b}));
  else if(sec==="cruce")list=CRUCE_VANOS.filter(([a,b])=>ids.has(a)&&ids.has(b)).map(([a,b])=>({a,b}));
  else{const es=estr(sec);list=[];for(let i=1;i<es.length;i++)list.push({a:es[i-1].id,b:es[i].id});}
  const tt={};for(const e of estr(sec))tt[e.id]=e.tt;
  for(const v of list){v.key=kV(sec,v.a,v.b);v.tt=tt[v.b]||tt[v.a]||"";v.label=v.a+"–"+v.b;}
  c.v[sec]=list;c.v["m_"+sec]=new Map();for(const v of list){c.v["m_"+sec].set(v.a+">"+v.b,v);c.v["m_"+sec].set(v.b+">"+v.a,v);}
  return list;}
const vanoBetween=(sec,a,b)=>{vanos(sec);return gc().v["m_"+sec].get(a+">"+b)||null;};
const vanosOf=(sec,id)=>vanos(sec).filter(v=>v.a===id||v.b===id);
function tenSplit(){const e=etapaById("ten")||{};const t=num(e.torre,30),v=num(e.vano,70);return {t,v,s:(t+v)||1};}
const condActs=()=>actsG("tva").filter(a=>a.circ);

function gPct(get,key,g){let W=0,P=0;for(const a of actsG(g)){const w=num(a.peso,0);W+=w;P+=w*get(key,a.id);}return W?P/W:0;}
function stE(get,sec,e){
  const k=kE(sec,e.id);const pre=gPct(get,k,"pre"),mon=gPct(get,k,"mon"),tto=gPct(get,k,"tto");let fun=0,fg=null;
  const ps=sec==="cruce"?patas(e.id):[];
  if(ps.length){fun=ps.reduce((x,p)=>x+gPct(get,kP(sec,e.id,p.pata),"cr"),0)/ps.length;fg="cr";}
  else{for(const g of FUNG){const v=gPct(get,k,g);if(v>fun){fun=v;fg=g;}}if(!fg)fg=e.fund||null;}
  return {pre,fun,mon,tto,fg};
}
function totE(st){const w={pre:pesoE("pre"),fun:pesoE("fun"),mon:pesoE("mon"),ten:pesoE("ten")};const W=w.pre+w.fun+w.mon+w.ten;return W?(w.pre*st.pre+w.fun*st.fun+w.mon*st.mon+w.ten*st.tto)/W:0;}
function estado(st){if(st.mon>=99.95)return "ter";if(st.pre+st.fun+st.mon+st.tto<=0)return "sin";return "eje";}
function calcSec(get,sec){
  const es=estr(sec);const acc={pre:0,fun:0,mon:0,tto:0};const cnt={sin:0,eje:0,ter:0};const byE={};const ind={per:0,acc:0,fun:0,mon:0};
  for(const e of es){const st=stE(get,sec,e);byE[e.id]=st;acc.pre+=st.pre;acc.fun+=st.fun;acc.mon+=st.mon;acc.tto+=st.tto;cnt[estado(st)]++;
    const k=kE(sec,e.id);if(get(k,"per")>=100)ind.per++;if(get(k,"acc")>=100)ind.acc++;if(st.fun>=99.95)ind.fun++;if(st.mon>=99.95)ind.mon++;}
  const n=es.length||1;const vs=vanos(sec);const byV={};let vs2=0,vdone=0;
  for(const v of vs){const p=gPct(get,v.key,"tva");byV[v.key]=p;vs2+=p;if(p>=99.95)vdone++;}
  const T=acc.tto/n,V=vs.length?vs2/vs.length:0;const sp=tenSplit();
  const stg={pre:acc.pre/n,fun:acc.fun/n,mon:acc.mon/n,ten:(sp.t*T+(vs.length?sp.v*V:0))/(sp.t+(vs.length?sp.v:0)),tenT:T,tenV:V};
  let W=0,P=0;for(const et of etapas()){const w=num(et.peso,0);W+=w;P+=w*(stg[et.id]||0);}
  return {stg,pct:W?P/W:0,cnt,byE,byV,ind,n:es.length,nv:vs.length,vdone,has:es.length>0};
}
function progress(get){const out={sec:{},total:0};let W=0,P=0;for(const s of secs()){const r=calcSec(get,s.id);out.sec[s.id]=r;if(r.has){W+=s.peso;P+=s.peso*r.pct;}}
  /* La subestación Tineo es parte del proyecto: entra al global con su propio peso */
  const se=seCalc(get);out.se=se;const ws=pesoSE();if(ws>0){W+=ws;P+=ws*se.total;}
  out.lineaPct=(()=>{let w=0,p=0;for(const s of secs()){const r=out.sec[s.id];if(r.has){w+=s.peso;p+=s.peso*r.pct;}}return w?p/w:0;})();
  out.total=W?P/W:0;return out;}

function unitLabel(d){if(!d)return "";if(d.kind==="se")return (SE_CAT_NAME[d.cat]||"S/E")+" "+d.unidad;if(d.kind==="vano")return "Vano "+d.unidad;return d.unidad+(d.pata?" · pata "+d.pata:"");}
function allHist(filter){const out=[];for(const [k,d] of S.av){if(!d||(filter&&!filter(k,d)))continue;for(const [hid,h] of Object.entries(d.hist||{})){if(h&&h.a)out.push(Object.assign({hid,k,sec:d.sector,uni:d.unidad,lab:unitLabel(d)},h));}}return out.sort((a,b)=>(b.ts||0)-(a.ts||0));}
function lastUpdate(){let m=null;for(const d of S.av.values())for(const h of Object.values((d&&d.hist)||{}))if(h&&h.fecha&&(!m||h.fecha>m))m=h.fecha;return m;}
const autor=h=>h.imp?"Carga desde matriz Excel":(h.pn||"Inspector");

const secColor=id=>`var(--c-${id})`;

function ring(p,size,col,label,sub){const sw=size>100?12:8;const r=(size-sw)/2-1,c=2*Math.PI*r,v=clamp(p,0,100),h=size/2;
  return `<span class="ringbox" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${sw}"/>${v>0?`<circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="${v>=99.5?"butt":"round"}" stroke-dasharray="${(c*v/100).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 ${h} ${h})"/>`:""}</svg><span class="rv"><span><b style="font-size:${size>100?"2.1rem":size>70?"1.05rem":".85rem"}" class="num">${label!=null?label:fmtP(p,size>100)}</b>${sub?`<br><span>${sub}</span>`:""}</span></span></span>`;}

/* ---------- render ---------- */
let rq=0,pendingRender=false,ptrDown=false;
/* Mientras el mouse/dedo está presionado no se redibuja: si no, el botón tocado (p. ej. "Guardar")
   se reemplaza entre el pointerdown y el click y el click se pierde. Se redibuja al soltar. */
document.addEventListener("pointerdown",()=>{ptrDown=true;},true);
const ptrRelease=()=>{if(!ptrDown)return;setTimeout(()=>{ptrDown=false;if(pendingRender){const ae=document.activeElement;if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&ae.type!=="file")return;pendingRender=false;render();}},0);};

  if(ptrDown){pendingRender=true;return;}
  if(ae&&($("#main").contains(ae)||$("#drawer").contains(ae))&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&ae.type!=="file"){pendingRender=true;renderChrome();return;}
  render();});}

function renderChrome(){
  const c=S.cfg||{};const ok=S.state==="ok";
  let ter=0,n=0;if(ok&&S.P)for(const s of secs()){ter+=S.P.sec[s.id].cnt.ter;n+=S.P.sec[s.id].n;}
  const r=$("#rotulo");r.className="rotulo"+(ok?"":" solo");

  ${ok?`<div class="cells"><div class="cell"><span class="lbl">Avance físico</span><b class="num">${n?fmtP(S.P.total,1):"—"}</b></div><div class="cell"><span class="lbl">Terminadas</span><b class="num">${n?ter+" / "+n:"—"}</b></div><div class="cell"><span class="lbl">Último registro</span><b class="num">${esc(fmtD(lastUpdate()))}</b></div></div>`:""}`;

  renderChrome();
  const m=$("#main");const ae=document.activeElement;const fid=ae&&ae.id?ae.id:null;const selS=fid&&ae.selectionStart!=null?ae.selectionStart:null;

function restoreFocus(fid,selS){if(!fid)return;const el=document.getElementById(fid);if(el&&document.activeElement!==el){el.focus({preventScroll:true});if(selS!=null&&el.setSelectionRange){try{el.setSelectionRange(selS,selS);}catch(e){}}}}

  return `<div class="auth"><form class="panel" id="f-login" novalidate><h2>Ingresar</h2><p class="small muted">Acceso solo para personal autorizado del proyecto. Si no tienes cuenta, pídela al administrador.</p>
    <div class="field"><label for="a-email">Correo</label><input id="a-email" type="email" autocomplete="email" required value="${esc(S.lastEmail||"")}"></div>
    <div class="field"><label for="a-pass">Contraseña</label><input id="a-pass" type="password" autocomplete="current-password" required></div>
    ${S.authErr?`<p class="err">${esc(S.authErr)}</p>`:""}${S.authMsg?`<p class="note small">${esc(S.authMsg)}</p>`:""}
    <button class="btn primary" type="submit" ${S.saving?"disabled":""}>${S.saving?"Ingresando…":"Ingresar"}</button>
    <button class="linklike" type="button" data-forgot="1">¿Olvidaste tu contraseña?</button></form></div>`;

async function doLogin(){
  const email=$("#a-email").value.trim(),pass=$("#a-pass").value;S.lastEmail=email;S.authErr="";S.authMsg="";
  if(!email||!pass){S.authErr="Ingresa tu correo y contraseña.";render();return;}
  S.saving=true;render();

const cls3=(c,p)=>{c.n++;if(p>=99.95)c.ter++;else if(p>0)c.eje++;else c.sin++;};
const cnt0=()=>({n:0,ter:0,eje:0,sin:0});
function kpiData(){
  const F=S.dashF;const P=S.P;const out={fun:cnt0(),mon:cnt0(),acc:cnt0(),pat:cnt0(),ten:cnt0(),c1:0,c2:0,opgw:0};
  for(const s of scopeSecs()){const r=P.sec[s.id];
    for(const e of estr(s.id)){if(F.contr&&e.contr!==F.contr)continue;if(F.tt&&e.tt!==F.tt)continue;
      const st=r.byE[e.id];const k=kE(s.id,e.id);
      cls3(out.fun,st.fun);cls3(out.mon,st.mon);cls3(out.acc,cur(k,"acc"));
      const ps=s.id==="cruce"?patas(e.id):[];
      cls3(out.pat,ps.length?ps.reduce((x,p)=>x+cur(kP(s.id,e.id,p.pata),"cr_pat"),0)/ps.length:cur(k,"pat"));}
    for(const v of vanos(s.id)){const eb=estById(s.id,v.b)||{};if(F.contr&&eb.contr!==F.contr)continue;if(F.tt&&v.tt!==F.tt)continue;
      cls3(out.ten,r.byV[v.key]||0);if(circPct(v.key,"1")>=99.95)out.c1++;if(circPct(v.key,"2")>=99.95)out.c2++;if(cur(v.key,"tv_opg")>=99.95)out.opgw++;}}
  return out;}

function drillHtml(et){

  g+=`<rect class="o" x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/>`;

function metaForKey(key){const D=S.drw;if(D.se)return key===kSE(D.cat,D.id)?{kind:"se",unidad:D.id,cat:D.cat}:null;const sec=D.sec;const e=estById(sec,D.id);

function saveErr(err,ok,total){
  const pre=total>1?`Se guardaron ${ok} de ${total}. `:"No se guardó. ";

  else if(err&&err.code==="unavailable")toast(pre+"Sin conexión con el servidor. Revisa tu internet e intenta de nuevo.",true);
  else toast(pre+"El servidor respondió: "+((err&&err.message)||"error desconocido"),true);}

async function guardar(){
  const r=S.reg;const aids=regAids(r);if(S.saving)return;
  {const pi=$("#r-pct"),fi=$("#r-fecha"),oi=$("#r-obs");if(pi&&pi.value!==""){const v=num(pi.value,NaN);if(isFinite(v))r.pct=pctIn(v);}if(fi&&fi.value)r.fecha=fi.value;if(oi)r.obs=oi.value;}
  if(r.act==="__cond"&&!aids.length){toast("Elige al menos una fase del conductor.",true);return;}
  const act=r.act==="__cond"?{id:aids,nombre:"Tendido de conductor ("+aids.length+" fase"+(aids.length>1?"s":"")+")"}:actById(r.act);
  if(!act||!r.sec||!r.sel.size)return;
  if(!(r.pct>=0&&r.pct<=100)){toast("El avance debe estar entre 0 y 100%.",true);return;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(r.fecha)||r.fecha>today()){toast("Revisa la fecha: no puede ser futura.",true);return;}
  const byUid=new Map(unitsFor(r,true).map(u=>[u.uid,u]));
  const ids=Array.isArray(act.id)?act.id:[act.id];
  const atras=[...r.sel].filter(uid=>{const u=byUid.get(uid);return u&&newerFecha(u.key,ids,r.fecha);});
  S.saving=true;render();const ts=Date.now();let ok=0,err=null;const hechos=new Set();
  for(const uid of r.sel){const u=byUid.get(uid);if(!u)continue;try{await saveOne(u.key,r.sec,u.meta,act.id,r.pct,r.fecha,r.obs,ts);ok++;hechos.add(uid);}catch(e){err=e;break;}}
  S.saving=false;
  /* lo ya guardado se quita de la selección para no duplicarlo al reintentar */
  r.sel=new Set([...r.sel].filter(uid=>!hechos.has(uid)));
  if(err){saveErr(err,ok,ok+r.sel.size);render();return;}
  const word=r.sec==="se"?"elemento(s)":r.grp==="tva"?"vano(s)":r.grp==="cr"?"pata(s)":"estructura(s)";
  if(atras.length)toast(`Guardado en ${ok} ${word}. Atención: en ${atras.length} ya había un registro con fecha posterior, así que su avance vigente no cambió (queda en el historial).`,true);
  else toast(`Avance guardado: ${act.nombre} ${fmtP(r.pct,r.pct%1!==0)} en ${ok} ${word}.`);
  r.obs="";render();
}

async function importarRespaldo(){

  if(!j||!j.config||!j.avance||typeof j.avance!=="object"){toast("El archivo no tiene el formato de respaldo esperado.",true);return;}
  const rows=Object.entries(j.avance).filter(([id,d])=>/^[A-Za-z0-9_.~:@+-]{1,200}$/.test(id)&&d&&typeof d==="object").map(([id,data])=>({id,data,updated_at:new Date().toISOString()}));
  S.imp={running:true,title:"Importando respaldo…",done:0,total:rows.length,msg:"Guardando configuración"};render();
  try{
    if(j.config.proyecto)await setConfig("proyecto",Object.assign({},j.config.proyecto,{importPendiente:false}));
    if(j.config.unidades)await setConfig("unidades",j.config.unidades);
    S.imp.msg="Guardando avances";
    for(let i=0;i<rows.length;i+=200){const ch=rows.slice(i,i+200);const {error}=await sb.from("avance").upsert(ch);if(error)throw mapErr(error);S.imp.done+=ch.length;schedule();}
    await loadAll();
    S.imp={running:false,ok:true,msg:`Respaldo importado: ${rows.length} registros de avance, ${((j.config.unidades||{}).estructuras||[]).length} estructuras.`};
  }catch(e){S.imp={running:false,ok:false,msg:e.code==="denied"?"No tienes permiso de administrador para importar.":(e.message||"Error al importar.")};}
  S.draft=null;render();

/* ---------- Importador de matrices ---------- */
function pv(s){s=String(s==null?"":s).trim();if(!s)return 0;const pc=s.includes("%");const n=num(s.replace("%","").replace(/\s/g,""),0);if(!pc&&n>0&&n<=1&&/[.,]/.test(s))return Math.round(n*1000)/10;return clamp(n,0,100);}
const splitRows=t=>t.replace(/^﻿/,"").split(/\r?\n/).map(l=>l.split(";"));
function fundOf(txt){const t=String(txt||"").toLowerCase();if(t.includes("metal"))return "amet";if(t.includes("hormig"))return "ahor";if(t.includes("zapata"))return "zv";if(t.includes("pila"))return "pila";return null;}
function parseGeneral(txt){
  const rows=splitRows(txt);const hi=rows.findIndex(r=>/^n\W*\s*estructura/i.test((r[0]||"").trim()));
  if(hi<0||rows[hi].length<49)throw new Error("La matriz general no tiene el formato esperado (falta la fila 'N Estructura'). Revisa que el CSV use punto y coma.");
  const est=[],vals=new Map(),seen=new Set();const chk={n:0,bad:[]};
  for(let i=hi+1;i<rows.length;i++){const r=rows[i];const id=(r[0]||"").trim();const zona=(r[2]||"").trim();const sec=ZONA[zona.toLowerCase()];
    if(!id||!sec||seen.has(id))continue;seen.add(id);
    const fund=sec==="cruce"?null:fundOf(r[55]);
    est.push({id,sec,zona,torre:(r[1]||"").trim(),tt:(r[3]||"").trim(),tipo:(r[4]||"").trim().replace("Suspension","Suspensión"),contr:CONTR_SECTOR[sec]||(r[5]||"").trim(),fund});
    const a={};for(const [c,aid] of Object.entries(COLS_G)){const ci=+c;if(sec==="cruce"&&ci>=12&&ci<=40)continue;const v=pv(r[ci]);if(v>0)a[aid]=v;}
    vals.set(kE(sec,id),{meta:{sector:sec,unidad:id,kind:"est"},acts:a});
    if(sec!=="cruce"){const get=(k,x)=>a[x]||0;let f=0;for(const g of FUNG)f=Math.max(f,gPct(get,"",g));const m=gPct(get,"","mon");chk.n++;if(Math.abs(f-pv(r[42]))>0.6||Math.abs(m-pv(r[48]))>0.6)chk.bad.push(id);}
  }
  if(!est.length)throw new Error("No se encontraron estructuras en la matriz general.");
  return {est,vals,chk};
}
function parseCruce(txt){
  const rows=splitRows(txt);const hi=rows.findIndex(r=>(r[3]||"").trim().toLowerCase()==="pata"&&/estructura/i.test(r[1]||""));
  if(hi<0)throw new Error("La matriz del cruce no tiene el formato esperado.");
  const pts=[],vals=new Map();const chk={n:0,bad:[]};
  for(let i=hi+1;i<rows.length;i++){const r=rows[i];const c0=(r[0]||"").trim();if(/^resumen/i.test(c0))break;
    const est=(r[1]||"").trim(),pata=(r[3]||"").trim().toUpperCase();if(!/^\d+$/.test(c0)||!est||!/^[A-D]$/.test(pata))continue;
    pts.push({est,torre:(r[2]||"").trim(),pata,zona:(r[4]||"").trim(),tf:(r[5]||"").trim()});
    const a={};for(const [c,aid] of Object.entries(COLS_C)){const v=pv(r[+c]);if(v>0)a[aid]=v;}
    vals.set(kP("cruce",est,pata),{meta:{sector:"cruce",unidad:est,pata,kind:"pata"},acts:a});
    chk.n++;if(Math.abs(gPct((k,x)=>a[x]||0,"","cr")-pv(r[18]))>0.6)chk.bad.push(est+"-"+pata);}
  return {patas:pts,vals,chk};
}
async function decodeBuf(buf){try{return new TextDecoder("utf-8",{fatal:true}).decode(buf);}catch(e){return new TextDecoder("windows-1252").decode(buf);}}
function managedFor(meta){if(meta.kind==="pata")return actsG("cr").map(a=>a.id);const gs=meta.sector==="cruce"?["pre","mon"]:["pre","amet","ahor","zv","pila","mon"];return acts().filter(a=>gs.includes(a.g)).map(a=>a.id);}
/* ¿El valor vigente de esta actividad viene de una importación de Excel? (las cargas antiguas no marcaban "imp" en act, pero su historial sí) */
function vigenteImportado(d,a){const x=d&&d.act&&d.act[a];if(!x)return true;return !!(x.imp||(d.hist&&d.hist["i"+x.ts+"_"+a]&&d.hist["i"+x.ts+"_"+a].imp));}
/* No reemplazar lo registrado en terreno (en la app) con fecha igual o posterior al corte del Excel */
function protegido(d,a,fecha){const x=d&&d.act&&d.act[a];return !!(x&&!vigenteImportado(d,a)&&(x.fecha||"")>=fecha);}
async function writeOp(op,fecha,ts){
  const act={},hist={};
  for(const [a,v] of Object.entries(op.ch)){hist["i"+ts+"_"+a]={a,pct:v,fecha,por:S.me,pn:S.userName,obs:"Carga desde matriz Excel",ts,imp:true};act[a]={pct:v,fecha,por:S.me,pn:S.userName,ts,imp:true};}
  const base=baseOf(op.x.meta.sector,op.x.meta);
  await rpcAvance(op.k,base,act,hist);mergeLocal(op.k,base,act,hist);
}
async function importar(genTxt,cruTxt,fecha){
  if(S.imp&&S.imp.running)return;
  S.imp={running:true,title:"Cargando matrices Excel…",done:0,total:0,msg:"Leyendo matrices"};render();
  try{
    const G=parseGeneral(genTxt);const C=cruTxt?parseCruce(cruTxt):{patas:(S.uni&&S.uni.patas)||[],vals:new Map(),chk:{n:0,bad:[]}};
    const torreCr={};for(const p of C.patas)if(!torreCr[p.est])torreCr[p.est]=p.torre;
    const uni={v:2,estructuras:G.est.map(e=>e.sec==="cruce"&&torreCr[e.id]?Object.assign({},e,{torre:torreCr[e.id]}):e),patas:C.patas,ts:Date.now()};
    S.imp.msg="Guardando la lista de estructuras";render();
    await withRetry(()=>setConfig("unidades",uni));
    const vals=new Map([...G.vals,...C.vals]);const ts=Date.now();const ops=[];let prot=0;
    for(const [k,x] of vals){const d=S.av.get(k);const ch={};
      for(const a of managedFor(x.meta)){const v=x.acts[a]||0;const c=d&&d.act&&d.act[a]?num(d.act[a].pct,0):0;if(Math.abs(c-v)>0.01){if(protegido(d,a,fecha)){prot++;continue;}ch[a]=v;}}
      if(Object.keys(ch).length)ops.push({k,d,x,ch});}
    S.imp.total=ops.length;S.imp.msg="Guardando avances";render();
    let i=0;const worker=async()=>{while(i<ops.length){const op=ops[i++];await withRetry(()=>writeOp(op,fecha,ts));S.imp.done++;schedule();}};
    await Promise.all([worker(),worker(),worker()]);
    await withRetry(()=>updateConfig("proyecto",{importPendiente:false,importado:{fecha,ts,cambios:ops.length,estructuras:uni.estructuras.length,patas:uni.patas.length}}));
    const bad=G.chk.bad.concat(C.chk.bad);
    S.imp={running:false,ok:true,msg:`Carga completa con fecha ${fmtD(fecha)}: ${uni.estructuras.length} estructuras y ${uni.patas.length} patas; ${ops.length} con cambios.${prot?` Se respetaron ${prot} avance(s) registrados en terreno con fecha igual o posterior al corte.`:""}`,
      chk:bad.length?`Verificación: ${bad.length} fila(s) no cuadran con los totales del Excel (${bad.slice(0,8).join(", ")}${bad.length>8?"…":""}).`:`Verificación: los totales de las ${G.chk.n+C.chk.n} filas cuadran con el Excel.`};
  }catch(e){S.imp={running:false,ok:false,msg:e.code==="denied"?"No tienes permiso de administrador.":((e&&e.message)||"Error")};}
  render();
}
async function importarArchivos(){
  const fg=$("#i-gen").files[0],fc=$("#i-cru").files[0],fecha=$("#i-fecha").value||today();
  if(!fg){toast("Selecciona al menos la matriz general.",true);return;}
  if(fecha>today()){toast("La fecha de corte no puede ser futura.",true);return;}
  const g=await decodeBuf(await fg.arrayBuffer());const c=fc?await decodeBuf(await fc.arrayBuffer()):null;
  await importar(g,c,fecha);
}

/* ---------- Subestación: pesos e importación ---------- */
async function guardarSE(){
  const sp=S.seDraft||sePesos();S.saving=true;render();
  try{await setConfig("se",Object.assign({},S.se||{},{pesos:Object.fromEntries(SE_CATS.map(c=>[c.id,num(sp[c.id],0)]))}));S.seDraft=null;toast("Pesos de la subestación guardados.");}
  catch(e){toast(e.code==="denied"?"No tienes permiso de administrador.":"No se pudo guardar.",true);}
  S.saving=false;render();
}
function seRowVals(cat,r){const a={};for(const x of SE_ACTS[cat]){const v=pv(r[x.col]);if(v>0)a[x.id]=v;}return a;}
function parseSEFund(txt){
  const rows=splitRows(txt);let mode=null;const out=[];const chk={n:0,bad:[]};
  for(const r of rows){const c1=(r[1]||"").trim();const C=c1.toUpperCase();
    if(C==="CANALETAS"){mode="can";continue;}if(C==="DRENAJES"){mode="dre";continue;}
    if(C==="FUNDACIONES"&&mode){mode="end";continue;}
    if(!mode&&/^item$/i.test(c1)&&/^id$/i.test((r[3]||"").trim())&&/replanteo/i.test(r[9]||"")){mode="fun";continue;}
    if(!mode||mode==="end"||!/^\d+$/.test(c1))continue;
    const it=SE_ITEMS.find(x=>x.cat===mode&&x.n===+c1);if(!it)continue;
    const a=seRowVals(mode,r);out.push({it,a});
    const W=SE_ACTS[mode].reduce((x,y)=>x+y.peso,0);const t=SE_ACTS[mode].reduce((x,y)=>x+y.peso*(a[y.id]||0),0)/W;chk.n++;
    const tc=(r[SE_TOTCOL[mode]]||"").trim();if(tc&&Math.abs(t-pv(tc))>0.6)chk.bad.push(it.id);}
  if(!out.some(x=>x.it.cat==="fun"))throw new Error("La matriz de fundaciones de la S/E no tiene el formato esperado (falta la fila de encabezado 'Item / ID / Replanteo').");
  return {out,chk};
}
function parseSEEst(txt){
  const rows=splitRows(txt);let mode=null;const out=[];const chk={n:0,bad:[]};
  for(const r of rows){const c1=(r[1]||"").trim();
    if(!mode&&/^item$/i.test(c1)&&/pre-?armado/i.test(r[9]||"")){mode="est";continue;}
    if(mode&&/^estructuras$/i.test(c1))break;
    if(!mode||!/^\d+$/.test(c1))continue;
    const it=SE_ITEMS.find(x=>x.cat==="est"&&x.n===+c1);if(!it)continue;
    const a=seRowVals("est",r);out.push({it,a});
    const t=SE_ACTS.est.reduce((x,y)=>x+y.peso*(a[y.id]||0),0)/100;chk.n++;
    const tc=(r[SE_TOTCOL.est]||"").trim();if(tc&&Math.abs(t-pv(tc))>0.6)chk.bad.push(it.id);}
  if(!out.length)throw new Error("La matriz de estructuras de la S/E no tiene el formato esperado (falta la fila 'Item / Pre-Armado').");
  return {out,chk};
}
async function importarArchivosSE(){
  const ff=$("#se-f").files[0],fe=$("#se-e").files[0],fecha=$("#se-fecha").value||today();
  if(!ff&&!fe){toast("Selecciona al menos una matriz de la subestación.",true);return;}
  if(fecha>today()){toast("La fecha de corte no puede ser futura.",true);return;}
  if(S.imp&&S.imp.running)return;
  S.imp={running:true,title:"Cargando matrices de la subestación…",done:0,total:0,msg:"Leyendo matrices"};render();
  try{
    const rows=[],chks=[];
    if(ff){const P=parseSEFund(await decodeBuf(await ff.arrayBuffer()));rows.push(...P.out);chks.push(P.chk);}
    if(fe){const P=parseSEEst(await decodeBuf(await fe.arrayBuffer()));rows.push(...P.out);chks.push(P.chk);}
    const ts=Date.now();const ops=[];
    let prot=0;
    for(const {it,a} of rows){const k=kSE(it.cat,it.id);const d=S.av.get(k);const ch={};for(const x of SE_ACTS[it.cat]){const v=a[x.id]||0;if(Math.abs(cur(k,x.id)-v)>0.01){if(protegido(d,x.id,fecha)){prot++;continue;}ch[x.id]=v;}}if(Object.keys(ch).length)ops.push({k,it,ch});}
    S.imp.total=ops.length;S.imp.msg="Guardando avances";render();
    let i=0;const worker=async()=>{while(i<ops.length){const op=ops[i++];const act={},hist={};
      for(const [aid,v] of Object.entries(op.ch)){hist["i"+ts+"_"+aid]={a:aid,pct:v,fecha,por:S.me,pn:S.userName,obs:"Carga desde matriz S/E",ts,imp:true};act[aid]={pct:v,fecha,por:S.me,pn:S.userName,ts,imp:true};}
      const base=baseOf("se",{kind:"se",unidad:op.it.id,cat:op.it.cat});await withRetry(()=>rpcAvance(op.k,base,act,hist));mergeLocal(op.k,base,act,hist);S.imp.done++;schedule();}};
    await Promise.all([worker(),worker(),worker()]);
    await withRetry(()=>setConfig("se",Object.assign({},S.se||{},{importado:{fecha,ts,filas:rows.length,cambios:ops.length}})));
    const bad=[].concat(...chks.map(c=>c.bad)),n=chks.reduce((x,c)=>x+c.n,0);
    S.imp={running:false,ok:true,msg:`Matrices S/E cargadas con fecha ${fmtD(fecha)}: ${rows.length} elementos leídos, ${ops.length} con cambios.${prot?` Se respetaron ${prot} avance(s) registrados en terreno con fecha igual o posterior al corte.`:""}`,chk:bad.length?`Verificación: ${bad.length} fila(s) no cuadran con el "Avance parcial" del Excel (${bad.slice(0,8).join(", ")}).`:`Verificación: las ${n} filas cuadran con el "Avance parcial" del Excel.`};
  }catch(e){S.imp={running:false,ok:false,msg:e.code==="denied"?"No tienes permiso de administrador.":((e&&e.message)||"Error")};}
  render();
}

/* ---------- CSV ---------- */
function descargarCSV(){
  const hist=allHist().filter(x=>!x.imp);
  const q=v=>{const s=String(v==null?"":v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const f=n=>String(Math.round(n*10)/10).replace(".",",");
  const L=["ESTADO POR ESTRUCTURA al "+fmtD(today()),"Sector;N° Estructura;Zona;Tramo tendido;Tipo;Torre;Contratista;Obras preliminares %;Fundación %;Tipo fundación;Montaje %;Tendido en torre %;Total estructura %;Estado"];
  for(const s of secs())for(const e of estr(s.id)){const st=S.P.sec[s.id].byE[e.id];L.push([s.nombre,e.id,e.zona,e.tt,e.tipo,e.torre,e.contr,f(st.pre),f(st.fun),st.fg?grupoById(st.fg).nombre:"",f(st.mon),f(st.tto),f(totE(st)),EST_TXT[estado(st)]].map(q).join(";"));}
  L.push("");L.push("VANOS");L.push("Sector;Vano;Tramo tendido;"+actsG("tva").map(a=>a.nombre+" %").join(";")+";Total vano %");
  for(const s of secs())for(const v of vanos(s.id))L.push([s.nombre,v.label,v.tt].concat(actsG("tva").map(a=>f(cur(v.key,a.id))),[f(S.P.sec[s.id].byV[v.key]||0)]).map(q).join(";"));
  L.push("");L.push("RESUMEN");L.push("Sector;"+etapas().map(e=>e.nombre+" %").join(";")+";Total sector %");
  for(const s of secs()){const r=S.P.sec[s.id];L.push([s.nombre].concat(etapas().map(e=>f(r.stg[e.id]||0)),[f(r.pct)]).map(q).join(";"));}
  L.push(["LÍNEA (Continente + Cruce + Isla)"].concat(etapas().map(()=>""),[f(S.P.lineaPct)]).map(q).join(";"));
  L.push(["SUBESTACIÓN TINEO"].concat(etapas().map(()=>""),[f(S.SE.total)]).map(q).join(";"));
  L.push(["PROYECTO (global ponderado)"].concat(etapas().map(()=>""),[f(S.P.total)]).map(q).join(";"));
  L.push("");L.push("SUBESTACIÓN TINEO · Contratista "+SE_CONTRATISTA+" · Avance global "+f(S.SE.total)+"%");L.push("Partida;N°;ID;Descripción;Grupo;Tipo;Avance %;Estado");
  for(const c of SE_CATS)for(const it of seItems(c.id)){const p=seP(it);L.push([c.nombre,it.n,it.id,it.desc,SE_GRP[it.grp]||"",it.tipo,f(p),EST_TXT[seEst(p)]].map(q).join(";"));}
  L.push("");L.push("REGISTROS EN TERRENO");L.push("Fecha;Sector;Unidad;Actividad;Avance %;Inspector;Observación");
  for(const h of hist.slice().reverse()){const a=actById(h.a),s=secById(h.sec);L.push([fmtD(h.fecha),s?s.nombre:h.sec,h.lab,a?a.nombre:h.a,f(num(h.pct,0)),h.pn||"",h.obs||""].map(q).join(";"));}
  descargar("avance-tineo-ancud-"+today()+".csv","﻿"+L.join("\r\n"),"text/csv;charset=utf-8");toast("Archivo descargado.");
}

/* ---------- tooltip ---------- */
const tipEl=()=>$("#gtip");
document.addEventListener("pointerover",ev=>{if(ev.pointerType==="touch")return;const t=ev.target.closest&&ev.target.closest("[data-tip]");const g=tipEl();if(!t){g.style.display="none";return;}g.textContent=t.getAttribute("data-tip");g.style.display="block";});
document.addEventListener("pointermove",ev=>{const g=tipEl();if(g.style.display!=="block")return;const w=g.offsetWidth,h=g.offsetHeight;let x=ev.clientX+14,y=ev.clientY+16;if(x+w>innerWidth-8)x=ev.clientX-w-12;if(y+h>innerHeight-8)y=ev.clientY-h-12;g.style.left=x+"px";g.style.top=y+"px";});
document.addEventListener("pointerout",ev=>{if(!ev.relatedTarget||!ev.relatedTarget.closest||!ev.relatedTarget.closest("[data-tip]"))tipEl().style.display="none";});
document.addEventListener("scroll",()=>{tipEl().style.display="none";},true);

/* ---------- eventos ---------- */
function go(tab){S.tab=tab;tipEl().style.display="none";try{history.replaceState(null,"","#"+tab);}catch(e){}render();window.scrollTo({top:0});}
function keepSel(){const ok=new Set(unitsFor(S.reg,true).map(u=>u.uid));S.reg.sel=new Set([...S.reg.sel].filter(u=>ok.has(u)));}
document.addEventListener("keydown",ev=>{const t=ev.target;if((ev.key==="Enter"||ev.key===" ")&&t&&t.matches&&t.matches("g[data-ose]")){ev.preventDefault();const v=t.getAttribute("data-ose");const i=v.indexOf("|");openDrawerSE(v.slice(0,i),v.slice(i+1));}});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&S.drw){if(S.drw.edit){S.drw.edit=null;render();}else closeDrawer();}});
document.addEventListener("submit",ev=>{ev.preventDefault();if(ev.target.id==="f-login")doLogin();else if(ev.target.id==="f-pass")doSetPass();});
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button,[data-close],g[data-ose]");if(!b)return;const ds=b.dataset;const r=S.reg;
  if(ds.close){closeDrawer();return;}
  if(ds.forgot){doForgot();return;}
  if(ds.logout){sb&&sb.auth.signOut();return;}
  if(ds.chpass){S.state="setpass";S.authMode="change";S.authErr="";render();return;}
  if(ds.cancelpass){S.authMode=null;S.state="ok";render();return;}
  if(ds.reload){location.reload();return;}
  if(ds.tab){go(ds.tab);return;}
  if(ds.open){const [s,id]=ds.open.split("|");tipEl().style.display="none";openDrawer(s,id,ds.pata);return;}
  if(ds.ose){const i=ds.ose.indexOf("|");tipEl().style.display="none";openDrawerSE(ds.ose.slice(0,i),ds.ose.slice(i+1));return;}
  if(ds.secat){S.seCat=ds.secat;render();return;}
  if(b.id==="se-save"){guardarSE();return;}
  if(b.id==="se-imp"){importarArchivosSE();return;}
  if(ds.dash){S.dash=ds.dash;render();return;}
  if(ds.dashet){S.dashEt=S.dashEt===ds.dashet?null:ds.dashet;render();return;}
  if(ds.kpi){S.map.layer=ds.kpi;S.map.contr=S.dashF.contr;S.map.tt=S.dashF.tt;S.map.q="";go("linea");return;}
  if(ds.kclear){S.dashF={contr:"",tt:""};S.dash="total";render();return;}
  if(ds.gott){S.map.tt=ds.gott;go("linea");return;}
  if(ds.layer){S.map.layer=ds.layer;render();return;}
  if(ds.tsec){S.tbl={sec:ds.tsec,q:"",tt:"",est:""};render();return;}
  if(ds.dpata){S.drw.pata=ds.dpata;S.drw.edit=null;render();return;}
  if(ds.dfg){S.drw.fgSel=ds.dfg;render();return;}
  if(ds.qe){if(!S.canWrite)return;const [key,aid]=ds.qe.split("|");const D=S.drw;if(D.edit&&D.edit.key===key&&D.edit.aid===aid){D.edit=null;}else{const c=cur(key,aid);const ac=actById(aid);D.edit={key,aid,pct:(ac&&ac.circ)||c>=100?100:Math.min(100,[25,50,75,100].find(x=>x>c)||100),fecha:today(),obs:""};}render();return;}
  if(ds.qp){S.drw.edit.pct=+ds.qp;render();return;}
  if(b.id==="q-save"){quickSave();return;}
  if(b.id==="q-cancel"){S.drw.edit=null;render();return;}
  if(ds.csv){descargarCSV();return;}
  if(ds.rsec){if(r.sec!==ds.rsec)S.reg=Object.assign(newReg(),{sec:ds.rsec});render();return;}
  if(ds.retapa){r.etapa=ds.retapa;r.grp=grpFor(ds.retapa,r.sec);r.act=null;keepSel();render();return;}
  if(ds.rgrp){r.grp=ds.rgrp;r.act=null;keepSel();render();return;}
  if(ds.ract){r.act=ds.ract;keepSel();render();return;}
  if(ds.ru){r.sel.has(ds.ru)?r.sel.delete(ds.ru):r.sel.add(ds.ru);render();return;}
  if(ds.rsel){const ids=regAids(r);r.sel=new Set(ds.rsel==="pend"?[...r.sel].concat(unitsFor(r,false).filter(u=>ids.some(a=>cur(u.key,a)<100)).map(u=>u.uid)):[]);render();return;}
  if(ds.rfase){r.fases.has(ds.rfase)?r.fases.delete(ds.rfase):r.fases.add(ds.rfase);render();return;}
  if(ds.rcirc){const ids=condActs().filter(a=>a.circ===ds.rcirc).map(a=>a.id);const all=ids.every(i=>r.fases.has(i));ids.forEach(i=>all?r.fases.delete(i):r.fases.add(i));render();return;}
  if(ds.rfall){r.fases=new Set(condActs().map(a=>a.id));render();return;}
  if(ds.rfnone){r.fases=new Set();render();return;}
  if(ds.rpct){r.pct=+ds.rpct;render();return;}
  if(ds.rreset){S.reg=newReg();render();return;}
  if(b.id==="r-save"){guardar();return;}
  if(b.id==="i-run"){importarArchivos();return;}
  if(b.id==="b-imp"){importarRespaldo();return;}
  if(b.id==="b-exp"){exportarRespaldo();return;}
  if(b.id==="c-save"){guardarConfig();return;}
  if(b.id==="c-discard"){S.draft=null;render();return;}
});
document.addEventListener("input",ev=>{
  const t=ev.target,ds=t.dataset;
  if(t.id==="q-pct"){const v=num(t.value,NaN);if(isFinite(v)&&S.drw&&S.drw.edit)S.drw.edit.pct=pctIn(v);return;}
  if(t.id==="q-fecha"){if(S.drw&&S.drw.edit)S.drw.edit.fecha=t.value;return;}
  if(t.id==="q-obs"){if(S.drw&&S.drw.edit)S.drw.edit.obs=t.value;return;}
  if(t.id==="r-obs"){S.reg.obs=t.value;return;}
  if(t.id==="r-fecha"){S.reg.fecha=t.value;return;}
  if(t.id==="r-pct"){const v=num(t.value,NaN);if(isFinite(v))S.reg.pct=pctIn(v);return;}
  if(t.id==="r-q"){S.reg.q=t.value;render();return;}
  if(t.id==="m-q"){S.map.q=t.value;render();return;}
  if(t.id==="t-q"){S.tbl.q=t.value;render();return;}
  if(!S.draft)return;
  if(ds.cf)S.draft[ds.cf]=t.value;
  else if(ds.sp)S.draft.sectores[+ds.sp].peso=num(t.value,0);
  else if(ds.pse)S.draft.pesoSE=num(t.value,0);
  else if(ds.ep)S.draft.etapas[+ds.ep].peso=num(t.value,0);
  else if(ds.tsp){const e=S.draft.etapas.find(x=>x.id==="ten");if(e)e[ds.tsp]=num(t.value,0);}
  else if(ds.an)S.draft.actividades[+ds.an].nombre=t.value;
  else if(ds.ap)S.draft.actividades[+ds.ap].peso=num(t.value,0);
  else if(ds.vn)S.draft.vanos[ds.vn]=t.value;
});
document.addEventListener("input",ev=>{const t=ev.target;if(t.dataset&&t.dataset.sep){if(!S.seDraft)S.seDraft=sePesos();S.seDraft[t.dataset.sep]=num(t.value,0);}});
document.addEventListener("change",ev=>{const t=ev.target;
  const set=fn=>{fn();if(ptrDown){pendingRender=true;return;}pendingRender=false;render();};
  if(t.id==="r-tt")return set(()=>{S.reg.tt=t.value;});
  if(t.id==="r-all")return set(()=>{S.reg.verTodas=t.checked;});
  if(t.id==="m-tt")return set(()=>{S.map.tt=t.value;});
  if(t.id==="k-contr")return set(()=>{S.dashF.contr=t.value;});
  if(t.id==="k-sec")return set(()=>{S.dash=t.value;S.dashEt=null;});
  if(t.id==="m-c")return set(()=>{S.map.contr=t.value;});
  if(t.id==="t-tt")return set(()=>{S.tbl.tt=t.value;});
  if(t.id==="t-est")return set(()=>{S.tbl.est=t.value;});
  if(t.id==="q-pct"||t.id==="q-fecha"||t.id==="r-pct"||t.id==="r-fecha"||t.dataset.sp||t.dataset.pse||t.dataset.ep||t.dataset.ap||t.dataset.tsp)set(()=>{});});
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"&&S.state==="ok"&&Date.now()-S.lastLoad>120000){try{await loadAll();render();}catch(e){}}});

/* ---------- inicio ---------- */
async function handleSession(session,force){
  const uid=session&&session.user?session.user.id:null;
  if(!force&&uid===S.me&&(S.state==="ok"||S.state==="setpass"))return;
  S.me=uid;S.authErr="";
  if(!uid){if(S.chan){sb.removeChannel(S.chan);S.chan=null;}S.cfg=null;S.uni=null;S.av=new Map();S.canWrite=false;S.canAdmin=false;S.drw=null;S.state="login";render();return;}
  const u=session.user;S.userEmail=u.email||"";S.userName=(u.user_metadata&&(u.user_metadata.nombre||u.user_metadata.full_name||u.user_metadata.name))||S.userEmail;
  if(S.authMode==="setpass"){S.state="setpass";render();return;}
  S.state="loading";render();
  try{
    const {data:adm}=await sb.from("admins").select("user_id").eq("user_id",uid).maybeSingle();S.canAdmin=!!adm;S.canWrite=true;
    await loadAll();subscribe();S.state="ok";
    const h0=(location.hash||"").slice(1);if(TABS.some(t=>t.id===h0))S.tab=h0;
    if(S.tab==="config"&&!S.canAdmin)S.tab="resumen";
  }catch(e){S.state="error";S.authErr=e.message||"Error de conexión.";}
  render();
}
render();
(async function boot(){
  if(!window.supabase||!APP.SUPABASE_URL||/TU-PROYECTO/.test(APP.SUPABASE_URL)||!APP.SUPABASE_ANON_KEY||/PEGA-AQUI/.test(APP.SUPABASE_ANON_KEY)){S.state="noconfig";render();return;}
  sb=window.supabase.createClient(APP.SUPABASE_URL,APP.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==="PASSWORD_RECOVERY")S.authMode="setpass";setTimeout(()=>handleSession(session,ev==="PASSWORD_RECOVERY"),0);});
  const {data:{session}}=await sb.auth.getSession();await handleSession(session);
})();
})();
</script>
